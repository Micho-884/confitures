<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellier à confitures</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Confitures">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Encode+Sans+Semi+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout : une étagère. En-tête-étiquette, onglets Cellier / Carnet, lots en étiquettes de pots, recettes rangées par millésime. */
:root {
  --bg: #f7f3f5;
  --paper: #fffcfd;
  --ink: #2a1a24;
  --muted: #76626d;
  --line: #e4d8de;
  --accent: #7a1f4a;      /* cassis */
  --accent-ink: #ffffff;
  --accent-soft: #f3e2ea;
  --apricot: #d9822b;
  --apricot-soft: #fbead6;
  --mure: #3b2a5c;
  --ok: #3f7a4a;
  --warn: #b5651d;
  --danger: #a3262f;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1418; --paper: #251c21; --ink: #f2e8ed; --muted: #b29fa9; --line: #3d2f36;
    --accent: #e07aa6; --accent-ink: #1b1418; --accent-soft: #3a2230;
    --apricot: #f0a65c; --apricot-soft: #3b2a1b; --mure: #a897d8;
    --ok: #7fc28a; --warn: #f0a65c; --danger: #f07a82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1418; --paper: #251c21; --ink: #f2e8ed; --muted: #b29fa9; --line: #3d2f36;
  --accent: #e07aa6; --accent-ink: #1b1418; --accent-soft: #3a2230;
  --apricot: #f0a65c; --apricot-soft: #3b2a1b; --mure: #a897d8;
  --ok: #7fc28a; --warn: #f0a65c; --danger: #f07a82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: grid; gap: 24px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* En-tête */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.head h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.05; }
.head .kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 20px 28px; }
.stat { display: grid; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

/* Barre d'outils */
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.tabs { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.wrap { grid-template-columns: minmax(0, 1fr); }
.wrap > *, .bar > * { min-width: 0; }
.tab { white-space: nowrap; border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; min-width: 0; width: 210px; max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--paper); border-color: var(--danger); }

/* Tableau de bord */
.dash { display: grid; gap: 16px; }
.dash-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.dash-row { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
.dash-row.b { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .dash-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dash-row, .dash-row.b { grid-template-columns: minmax(0, 1fr); } }
.dcard { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.dcard h2 { font-size: 21px; }
.dcard .sub { color: var(--muted); font-size: 13px; margin-top: -6px; }
.kpi .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.kpi .big { font-family: var(--f-display); font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .big small { font-family: var(--f-mono); font-size: 15px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.meter { display: block; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i, .d-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.lotbars { display: grid; gap: 12px; }
.lotbar { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 3.4em; gap: 6px 12px; align-items: center; }
.lb-name { display: grid; min-width: 0; }
.lb-name b { overflow-wrap: anywhere; }
.lb-name span { font-size: 12px; color: var(--muted); }
.lb-track { display: flex; height: 20px; border-radius: 4px; overflow: hidden; min-width: 6px; }
.lb-track .used { background: var(--line); }
.lb-n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
@media (max-width: 560px) { .lotbar { grid-template-columns: minmax(0, 1fr) 3.4em; } .lb-name { grid-column: 1 / -1; } }
.donut-row { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
.donut-row svg { flex: 0 0 auto; max-width: 100%; }
.d-big { font-family: var(--f-display); font-size: 36px; fill: var(--ink); }
.d-small { font-size: 12px; fill: var(--muted); }
.d-legend { display: grid; gap: 12px; flex: 1; min-width: 160px; }
.d-legend div { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 4px; }
.d-legend i { margin-top: 5px; }
.d-legend small { display: block; font-size: 12px; color: var(--muted); }
.d-legend b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.vintages { display: grid; gap: 18px; }
.vint { display: grid; gap: 6px; }
.v-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.v-year { font-family: var(--f-display); font-size: 26px; color: var(--accent); }
.v-n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.alert { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.alert:first-child { border-top: 0; padding-top: 0; }
.alert .bar { align-self: stretch; border-radius: 3px; }
.alert .meta { color: var(--muted); font-size: 13px; }
.alert .v { font-family: var(--f-mono); font-size: 20px; }
.pill.old { background: var(--accent-soft); color: var(--accent); }
.recipe-evo { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.yr { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; justify-items: start; }
.yr .s { font-family: var(--f-mono); font-size: 22px; }
.arrow { color: var(--muted); font-size: 22px; }
.lieu-block { display: grid; gap: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.lieu-block:first-child { border-top: 0; padding-top: 0; }
.lieu-name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.lieu-name span { color: var(--muted); font-size: 13px; }
.lieux { display: grid; gap: 6px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1.7fr) repeat(3, minmax(0, .8fr)) 34px; gap: 6px; align-items: center; }
.lrow.head span { font-size: 12px; color: var(--muted); font-weight: 600; }
.lrow input { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); width: 100%; min-width: 0; }
.l-del { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; height: 36px; font-size: 18px; color: var(--muted); }
.l-del:hover { color: var(--danger); border-color: var(--danger); }
@media (max-width: 520px) {
  .lrow { grid-template-columns: repeat(3, minmax(0, 1fr)) 34px; }
  .lrow .l-nom { grid-column: 1 / -1; }
  .lrow.head span:first-child { display: none; }
  .lrow:not(.head) { padding-top: 8px; border-top: 1px dashed var(--line); }
}
.remplis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.remplis label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.remplis input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); width: 100%; min-width: 0; }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.place { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.place.none { border-style: dashed; }
.pl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pl-head b { overflow-wrap: anywhere; }
.pl-n { font-family: var(--f-display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.pl-n small { font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.place .lb-track { height: 12px; }
.pl-parfums { display: flex; flex-wrap: wrap; gap: 6px; }
.pl-chip { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.pl-chip b { font-family: var(--f-mono); font-weight: 500; margin-left: 2px; }
/* Onglet Étiquettes */
.etq { display: grid; gap: 28px; }
.etq-sec { display: grid; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.sec-head h2 { font-size: 26px; }
.tplgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.tplcard { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.tplcard .thumb { display: grid; place-items: center; background: var(--bg); border-radius: 8px; padding: 12px 8px; }
.tplcard canvas { box-shadow: 0 1px 4px rgba(0, 0, 0, .18); border-radius: 3px; max-width: 100%; }
.tplcard canvas.round { border-radius: 50%; }
.tpl-info { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.tpl-info .hint { flex-basis: 100%; }
.lotlist { display: grid; gap: 8px; }
.lotrow { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.lotrow > div { display: grid; min-width: 0; }
.sortby { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.sortby select { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; background: var(--paper); color: var(--ink); }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Cellier : étiquettes de pots */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.label {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0;
  position: relative;
}
.label.empty-lot { opacity: .62; }
.label .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.label h3 { font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.vintage {
  font-family: var(--f-mono); font-size: 13px; letter-spacing: .06em;
  border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 1px 7px; white-space: nowrap;
}
.meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.meta .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.jars { display: flex; flex-wrap: wrap; gap: 4px; }
.jar { width: 14px; height: 18px; border-radius: 3px 3px 5px 5px; border: 1.5px solid var(--accent); position: relative; }
.jar::before { content: ""; position: absolute; left: 1px; right: 1px; top: -4px; height: 3px; border-radius: 1px; background: var(--muted); }
.jar.full { background: var(--accent); }
.jar.petit { width: 11px; height: 13px; }
.jar.grand { width: 18px; height: 24px; }
.jars { align-items: end; }
.size-tag { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--apricot-soft); border-radius: 4px; padding: 1px 7px; }
.sizes { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.sizes b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.sizes .chip { font-family: var(--f-body); }
.sizerows { display: grid; gap: 6px; }
.srow { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) auto auto; align-items: center; gap: 8px; }
.srow .size-tag { text-align: center; }
.srow .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.srow .n b { font-size: 17px; font-weight: 500; }
.srow .stepper button { width: 32px; height: 32px; }
.potgrid { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.potgrid.edit { grid-template-columns: 6em minmax(0, 1fr) minmax(0, 1fr); }
.potgrid label { font-size: 14px; font-weight: 500; }
.potgrid input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); width: 100%; min-width: 0; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 6.5em; gap: 6px; }
#f_prov { text-transform: uppercase; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.flabel { font-size: 13px; font-weight: 500; color: var(--muted); }
.preview-wrap { display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 18px 12px; }
#e_prev { box-shadow: 0 1px 5px rgba(0, 0, 0, .2); border-radius: 3px; max-width: 100%; }
#e_prev.round { border-radius: 50%; }
dialog.big { width: min(940px, calc(100vw - 32px)); }
.contents { display: contents; }
.stage-wrap { display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px 8px; overflow: hidden; }
.stage { position: relative; box-shadow: 0 1px 5px rgba(0, 0, 0, .2); max-width: 100%; border-radius: 3px; overflow: hidden; }
.stage.round { border-radius: 50%; }
.stage canvas { display: block; width: 100%; height: 100%; }
#t_boxes { position: absolute; inset: 0; touch-action: none; }
.fbox { position: absolute; border: 1px dashed rgba(122, 31, 74, .55); border-radius: 2px; cursor: grab; touch-action: none; }
.fbox.sel { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.fbox .h-w, .fbox .h-s { position: absolute; touch-action: none; background: var(--paper); border: 2px solid var(--accent); }
.fbox .h-w { right: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; cursor: ew-resize; }
.fbox .h-s { right: -9px; bottom: -9px; width: 16px; height: 16px; border-radius: 3px; cursor: nwse-resize; background: var(--accent); }
.quick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.quick b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 4.2em; text-align: center; }
.quick .flabel:not(:first-child) { margin-left: 10px; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.addrow select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); }
.props { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
input[type="color"] { height: 38px; padding: 2px 4px; }
.count { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.count .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 15px; }
.count .n b { font-size: 20px; font-weight: 500; }
.stepper { display: flex; gap: 6px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; }
.stepper button:hover { border-color: var(--accent); color: var(--accent); }
.pill { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.pill.low { background: var(--apricot-soft); color: var(--warn); }
.pill.out { background: var(--line); color: var(--muted); }
.pill.ex { background: var(--accent-soft); color: var(--accent); }
.label .actions { display: flex; gap: 4px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 8px; }

/* Carnet de recettes */
.year { display: grid; gap: 14px; }
.year-head { display: flex; align-items: baseline; gap: 14px; }
.year-head h2 { font-size: 34px; color: var(--accent); font-variant-numeric: tabular-nums; }
.year-head span { color: var(--muted); font-size: 14px; }
.year-head::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); transform: translateY(-6px); }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.recipe { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.recipe h3 { font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
.recipe .fruit { color: var(--muted); font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; border-block: 1px solid var(--line); padding-block: 10px; }
.fact { display: grid; }
.fact b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 16px; }
.fact span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stars { color: var(--apricot); letter-spacing: 2px; font-size: 15px; }
.versions { font-size: 13px; color: var(--muted); }
.versions button { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
details summary { cursor: pointer; font-weight: 500; color: var(--accent); }
details .body { display: grid; gap: 10px; padding-top: 10px; }
details h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
details ul, details ol { margin: 0; padding-left: 20px; }
details p { margin: 0; }
.recipe .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.recipe.flash { outline: 2px solid var(--apricot); }

.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: var(--r); padding: 32px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 22px; }
.notice { background: var(--apricot-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; }

/* Dialogue */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--paper); color: var(--ink); width: min(620px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); }
dialog::backdrop { background: rgba(20, 8, 15, .45); }
dialog form { display: grid; gap: 14px; padding: 22px; }
dialog h2 { font-size: 26px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); width: 100%; min-width: 0; }
.field textarea { min-height: 88px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.form-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.form-actions .right { display: flex; gap: 8px; margin-left: auto; }
.err { color: var(--danger); font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; }

@media (max-width: 520px) {
  .fields { grid-template-columns: 1fr; }
  .search { width: 100%; }
  .tools { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .label, .recipe { transition: border-color .15s; }
  .label:hover, .recipe:hover { border-color: var(--accent); }
}

/* Version iPhone */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
input, select, textarea { font-size: 16px; } /* évite le zoom automatique de Safari */
.local-sheet { position: fixed; inset: 0; z-index: 1000; background: rgba(20, 8, 15, .45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.local-card { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: grid; gap: 12px; }
.local-card h2 { font-size: 22px; }
.local-card p { margin: 0; color: var(--muted); }
.local-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <div class="kicker">Confitures maison</div>
      <h1>Cellier à confitures</h1>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><b id="sPots">–</b><span>pots en réserve</span></div>
      <div class="stat"><b id="sParfums">–</b><span>parfums</span></div>
      <div class="stat"><b id="sRecettes">–</b><span>recettes</span></div>
      <div class="stat"><b id="sAnnees">–</b><span>millésimes</span></div>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-tableau" aria-selected="true" data-view="dashboard">Tableau de bord</button>
      <button class="tab" role="tab" id="tab-cellier" aria-selected="false" data-view="cellier">Cellier</button>
      <button class="tab" role="tab" id="tab-carnet" aria-selected="false" data-view="carnet">Carnet de recettes</button>
      <button class="tab" role="tab" id="tab-etiquettes" aria-selected="false" data-view="etiquettes">Étiquettes</button>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Chercher un fruit, un parfum…" aria-label="Rechercher">
      <button class="btn" id="exportBtn" hidden>Exporter en Excel</button>
      <label class="btn" id="importBtn" for="importInput" role="button" tabindex="0" hidden>Importer Excel</label>
      <input type="file" id="importInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
      <button class="btn primary" id="addBtn">+ Nouveau lot</button>
    </div>
  </div>

  <div class="chips" id="years" aria-label="Filtrer par année"></div>

  <main id="view"></main>
</div>

<dialog id="dlg"><form id="frm" novalidate></form></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="local-shim.js"></script>
<script>
(() => {
  const THIS_YEAR = new Date().getFullYear();
  const state = { view: "dashboard", year: "all", taille: "all", lieu: "all", sort: "numero", q: "", recettes: [], lots: [], ready: { r: false, l: false } };
  const TAILLES = [
    { v: "petit", t: "Petit", pl: "Petits", g: 250 },
    { v: "standard", t: "Standard", pl: "Standards", g: 370 },
    { v: "grand", t: "Grand", pl: "Grands", g: 720 },
  ];
  // Taille d'un lot : le champ enregistré, sinon déduite de la contenance.
  function tailleOf(l) {
    if (TAILLES.some(t => t.v === l.taille)) return l.taille;
    const c = num(l.contenance);
    if (!c) return "standard";
    return c <= 280 ? "petit" : (c <= 500 ? "standard" : "grand");
  }
  const tailleLabel = (v) => (TAILLES.find(t => t.v === v) || TAILLES[1]).t;
  // Pots d'un lot par taille : { petit: {n: remplis, r: restants}, standard: {...}, grand: {...} }.
  // Les anciens lots (une seule taille) sont convertis à la volée.
  function potsOf(l) {
    const out = {}; TAILLES.forEach(t => { out[t.v] = { n: 0, r: 0 }; });
    if (l.pots && typeof l.pots === "object") {
      TAILLES.forEach(t => { const p = l.pots[t.v] || {}; const r = Math.max(0, num(p.r)); out[t.v] = { n: Math.max(r, num(p.n)), r }; });
    } else {
      const r = Math.max(0, num(l.restants)); out[tailleOf(l)] = { n: Math.max(r, num(l.nbPots)), r };
    }
    // Lot réparti entre plusieurs lieux : les pots restants sont la somme des lieux.
    if (Array.isArray(l.lieux) && l.lieux.length) TAILLES.forEach(t => {
      const r = l.lieux.reduce((a, x) => a + Math.max(0, Math.round(num((x.pots || {})[t.v]))), 0);
      out[t.v] = { n: Math.max(out[t.v].n, r), r };
    });
    return out;
  }
  // Lieux de stockage d'un lot : [{ nom, pots: { petit, standard, grand } }] (pots restants dans ce lieu).
  function lieuxOf(l) {
    if (Array.isArray(l.lieux) && l.lieux.length) return l.lieux.map(x => {
      const pots = {}; TAILLES.forEach(t => { pots[t.v] = Math.max(0, Math.round(num((x.pots || {})[t.v]))); });
      return { nom: String(x.nom || "").trim(), pots };
    });
    const P = potsOf(l), pots = {}; TAILLES.forEach(t => { pots[t.v] = P[t.v].r; });
    return [{ nom: String(l.emplacement || "").trim(), pots }];
  }
  const lieuTotal = (x) => TAILLES.reduce((a, t) => a + x.pots[t.v], 0);
  const lieuKey = (nom) => norm(String(nom || "").trim()) || "_";
  // Champs d'un lot calculés à partir des pots remplis par taille et de la répartition par lieu.
  function lotBody(nBySize, lieux) {
    const merged = [];
    lieux.forEach(x => {
      const k = lieuKey(x.nom), same = merged.find(m => lieuKey(m.nom) === k);
      if (same) TAILLES.forEach(t => { same.pots[t.v] += x.pots[t.v]; }); else merged.push({ nom: String(x.nom || "").trim(), pots: { ...x.pots } });
    });
    if (!merged.length) merged.push({ nom: "", pots: { petit: 0, standard: 0, grand: 0 } });
    const pots = {};
    TAILLES.forEach(t => { const r = merged.reduce((a, x) => a + x.pots[t.v], 0); pots[t.v] = { n: Math.max(Math.round(num(nBySize[t.v])), r), r }; });
    return { lieux: merged, pots, nbPots: TAILLES.reduce((a, t) => a + pots[t.v].n, 0), restants: TAILLES.reduce((a, t) => a + pots[t.v].r, 0),
      emplacement: merged.map(x => x.nom).filter(Boolean).join(", ") };
  }
  const lotTitle = (l) => (l.numero ? `${l.numero} - ` : "") + (l.nom || "Sans nom");
  // Numéros de lot : uniques pour une même année (on peut avoir un lot 1 en 2025 et un lot 1 en 2026).
  function nextNumero(annee) { return state.lots.filter(l => num(l.annee) === num(annee)).reduce((m, l) => Math.max(m, num(l.numero)), 0) + 1; }
  const totRestants = (l) => { const P = potsOf(l); return TAILLES.reduce((a, t) => a + P[t.v].r, 0); };
  const SORTS = {
    numero: (a, b) => (num(a.numero) || 1e9) - (num(b.numero) || 1e9) || num(b.annee) - num(a.annee) || String(a.nom).localeCompare(b.nom, "fr"),
    alpha: (a, b) => String(a.nom).localeCompare(b.nom, "fr", { sensitivity: "base" }) || num(b.annee) - num(a.annee) || num(a.numero) - num(b.numero),
    restants: (a, b) => totRestants(b) - totRestants(a) || (num(a.numero) || 1e9) - (num(b.numero) || 1e9),
  };
  let db = null, canWrite = true;

  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  const VIEWS = ["dashboard", "cellier", "carnet", "etiquettes"];
  try { const v = localStorage.getItem("cellier.view"); if (VIEWS.includes(v)) state.view = v; } catch (e) {}
  const HASH = { "#tableau": "dashboard", "#cellier": "cellier", "#carnet": "carnet", "#etiquettes": "etiquettes" };
  if (HASH[location.hash]) state.view = HASH[location.hash];

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
  }
  function notice(msg) { const n = $("#notice"); n.textContent = msg; n.hidden = !msg; }

  // ---------- Rendu ----------
  function ratio(r) { const f = num(r.fruitsG), s = num(r.sucreG); return f > 0 && s > 0 ? Math.round(s / f * 100) : null; }
  function stars(n) { n = Math.max(0, Math.min(5, num(n))); return n ? "★".repeat(n) + "☆".repeat(5 - n) : ""; }
  function matches(obj, fields) {
    if (!state.q) return true;
    const q = norm(state.q);
    return fields.some(f => norm(obj[f]).includes(q));
  }

  function renderStats() {
    const pots = state.lots.reduce((a, l) => a + Math.max(0, num(l.restants)), 0);
    const parfums = new Set(state.lots.filter(l => num(l.restants) > 0).map(l => norm(l.nom))).size;
    const annees = new Set([...state.recettes.map(r => r.annee), ...state.lots.map(l => l.annee)].filter(Boolean));
    $("#sPots").textContent = pots;
    $("#sParfums").textContent = parfums;
    $("#sRecettes").textContent = state.recettes.length;
    $("#sAnnees").textContent = annees.size;
  }

  function renderYears() {
    if (state.view === "dashboard") { $("#years").innerHTML = ""; return; }
    const src = state.view === "carnet" ? state.recettes : state.lots;
    const years = [...new Set(src.map(x => num(x.annee)).filter(Boolean))].sort((a, b) => b - a);
    if (state.year !== "all" && !years.includes(num(state.year))) state.year = "all";
    const el = $("#years");
    if (years.length < 2) { el.innerHTML = ""; return; }
    el.innerHTML = [`<button class="chip" data-year="all" aria-pressed="${state.year === "all"}">Toutes</button>`]
      .concat(years.map(y => `<button class="chip" data-year="${y}" aria-pressed="${String(state.year) === String(y)}">${y}</button>`)).join("");
  }

  function lotCard(l) {
    const P = potsOf(l);
    const n = TAILLES.reduce((a, t) => a + P[t.v].r, 0), total = TAILLES.reduce((a, t) => a + P[t.v].n, 0);
    const used = TAILLES.filter(t => P[t.v].n > 0);
    const L = lieuxOf(l), multi = L.length > 1;
    const srow = (t, r, nn, li, where) => {
      const shown = Math.min(nn, 12);
      const jars = Array.from({ length: shown }, (_, i) => `<span class="jar ${t.v}${i < r ? " full" : ""}"></span>`).join("") + (nn > shown ? `<span class="hint">+${nn - shown}</span>` : "");
      const lbl = `${t.t.toLowerCase()}${where ? " (" + where + ")" : ""}`;
      return `<div class="srow"><span class="size-tag">${t.t}</span><span class="jars" aria-hidden="true">${jars}</span>
        <span class="n"><b>${r}</b>${multi ? "" : "/" + nn}</span>
        <span class="stepper"><button type="button" data-act="minus" data-size="${t.v}" data-lieu="${li}" aria-label="Retirer un pot ${esc(lbl)}" ${r === 0 || !canWrite ? "disabled" : ""}>−</button><button type="button" data-act="plus" data-size="${t.v}" data-lieu="${li}" aria-label="Ajouter un pot ${esc(lbl)}" ${!canWrite ? "disabled" : ""}>+</button></span></div>`;
    };
    const rows = multi
      ? L.map((x, i) => { const ts = TAILLES.filter(t => x.pots[t.v] > 0); const tot = lieuTotal(x);
          return `<div class="lieu-block"><div class="lieu-name"><b>${esc(x.nom || "Lieu non indiqué")}</b><span>${tot} pot${tot > 1 ? "s" : ""}</span></div>${ts.map(t => srow(t, x.pots[t.v], x.pots[t.v], i, x.nom)).join("")}</div>`; }).join("")
      : (used.length ? used : [TAILLES[1]]).map(t => srow(t, P[t.v].r, P[t.v].n, 0, "")).join("");
    const pill = n === 0 ? `<span class="pill out">Épuisé</span>` : (n <= 2 ? `<span class="pill low">Bientôt fini</span>` : "");
    const rec = l.recetteId && state.recettes.find(r => r.id === l.recetteId);
    const meta = [
      l.date ? `<span>Mise en pot : ${esc(fmtDate(l.date))}</span>` : "",
      l.provenance ? `<span>Fruits de ${esc(l.provenance)}</span>` : "",
      !multi && L[0].nom ? `<span>${esc(L[0].nom)}</span>` : ""
    ].filter(Boolean).join("");
    return `<article class="label${n === 0 ? " empty-lot" : ""}" data-lot="${esc(l.id)}">
      <div class="top"><h3>${esc(lotTitle(l))}</h3><span class="vintage">${esc(l.annee || "—")}</span></div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
      <div class="sizerows">${rows}</div>
      <div class="count">
        <span class="n">Total : <b>${n}</b> / ${total} pots ${pill} ${l.exemple ? `<span class="pill ex">Exemple</span>` : ""}</span>
      </div>
      ${l.notes ? `<div class="meta">${esc(l.notes)}</div>` : ""}
      <div class="actions">
        ${rec ? `<button class="btn ghost small" data-act="see-recipe" data-id="${esc(rec.id)}">Voir la recette</button>` : ""}
        <button class="btn ghost small" data-act="labels">Étiquettes</button>
        ${n > 0 ? `<button class="btn ghost small" data-act="move-lot" ${!canWrite ? "disabled" : ""}>Déplacer des pots</button>` : ""}
        <button class="btn ghost small" data-act="dup-lot" ${!canWrite ? "disabled" : ""}>Dupliquer</button>
        <button class="btn ghost small" data-act="edit-lot" ${!canWrite ? "disabled" : ""}>Modifier</button>
      </div>
    </article>`;
  }

  const MOIS = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
  function fmtDate(d) {
    // Mois et année en majuscules : « OCTOBRE 2026 » (dates enregistrées en AAAA-MM ou AAAA-MM-JJ).
    const m = /^(\d{4})-(\d{2})/.exec(d || ""); if (!m || +m[2] < 1 || +m[2] > 12) return d || "";
    return `${MOIS[+m[2] - 1]} ${m[1]}`;
  }

  function renderCellier() {
    const base = state.lots.filter(l => (state.year === "all" || String(l.annee) === String(state.year)) && matches(l, ["numero", "nom", "emplacement", "provenance", "notes"]));
    const allLieux = new Map(); state.lots.forEach(l => lieuxOf(l).forEach(x => { const k = lieuKey(x.nom); if (!allLieux.has(k)) allLieux.set(k, x.nom || "Lieu non indiqué"); }));
    if (state.lieu !== "all" && !allLieux.has(state.lieu)) state.lieu = "all";
    const inLieu = (l) => state.lieu === "all" ? null : lieuxOf(l).filter(x => lieuKey(x.nom) === state.lieu);
    const rOf = (l, size) => { const xs = inLieu(l); return xs ? xs.reduce((a, x) => a + x.pots[size], 0) : potsOf(l)[size].r; };
    const base2 = base.filter(l => state.lieu === "all" || inLieu(l).length);
    let lots = base2.filter(l => state.taille === "all" || potsOf(l)[state.taille].n > 0);
    lots.sort(SORTS[state.sort] || SORTS.numero);
    if (!state.ready.l) return `<div class="empty"><h3>Ouverture du cellier…</h3><p>Vos lots de pots vont apparaître ici.</p></div>`;
    if (!state.lots.length) return `<div class="empty"><h3>Le cellier est vide</h3><p>Ajoutez votre premier lot : le parfum, l'année et le nombre de pots remplis.</p><button class="btn primary" data-act="new-lot">+ Nouveau lot</button></div>`;
    const parTaille = TAILLES.map(t => ({ ...t, n: base2.reduce((a, l) => a + rOf(l, t.v), 0) }));
    const sizes = `<div class="sizes" aria-label="Pots restants par taille">
      <span>En réserve :</span>
      ${parTaille.map(t => `<span><b>${t.n}</b> ${t.n > 1 ? t.pl.toLowerCase() : t.t.toLowerCase()}</span>`).join("")}
      <span class="chips" style="margin-left:auto">
        <button class="chip" data-taille="all" aria-pressed="${state.taille === "all"}">Toutes tailles</button>
        ${TAILLES.map(t => `<button class="chip" data-taille="${t.v}" aria-pressed="${state.taille === t.v}">${t.pl}</button>`).join("")}
      </span>
      ${allLieux.size > 1 ? `<label class="sortby" for="lieuSel"><span>Lieu</span>
        <select id="lieuSel"><option value="all">Tous les lieux</option>${[...allLieux].sort((a, b) => (a[0] === "_") - (b[0] === "_") || a[1].localeCompare(b[1], "fr")).map(([k, n]) => `<option value="${esc(k)}" ${state.lieu === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      </label>` : ""}
      <label class="sortby" for="sortSel"><span>Trier par</span>
        <select id="sortSel">${[["numero", "N° de lot"], ["alpha", "Ordre alphabétique"], ["restants", "Pots restants"]].map(([v, t]) => `<option value="${v}" ${state.sort === v ? "selected" : ""}>${t}</option>`).join("")}</select>
      </label>
    </div>`;
    if (!lots.length) return sizes + `<div class="empty"><p>Aucun lot ne correspond à cette recherche.</p></div>`;
    return sizes + `<div class="grid">${lots.map(lotCard).join("")}</div>`;
  }

  function recipeCard(r) {
    const rt = ratio(r);
    const others = state.recettes.filter(o => o.id !== r.id && norm(o.nom) === norm(r.nom)).sort((a, b) => num(b.annee) - num(a.annee));
    const lines = (t) => String(t || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
    const ing = lines(r.ingredients);
    const potsFaits = state.lots.filter(l => l.recetteId === r.id).reduce((a, l) => a + num(l.nbPots), 0);
    return `<article class="recipe" id="r-${esc(r.id)}" data-recipe="${esc(r.id)}">
      <div class="top" style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <div><h3>${esc(r.nom || "Sans nom")}</h3>${r.fruits ? `<div class="fruit">${esc(r.fruits)}</div>` : ""}</div>
        <span class="vintage">${esc(r.annee || "—")}</span>
      </div>
      <div class="facts">
        <div class="fact"><b>${rt != null ? rt + " %" : "—"}</b><span>Sucre / fruit</span></div>
        <div class="fact"><b>${r.cuisson ? esc(r.cuisson) + " min" : "—"}</b><span>Cuisson</span></div>
        <div class="fact"><b>${r.rendement ? esc(r.rendement) : "—"}</b><span>Pots prévus</span></div>
      </div>
      ${r.note || r.exemple ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${r.note ? `<span class="stars" aria-label="${num(r.note)} sur 5">${stars(r.note)}</span>` : ""}${r.exemple ? `<span class="pill ex">Exemple</span>` : ""}</div>` : ""}
      ${others.length ? `<div class="versions">Aussi faite en ${others.map(o => `<button data-act="goto" data-id="${esc(o.id)}">${esc(o.annee)}</button>`).join(", ")}</div>` : ""}
      ${potsFaits ? `<div class="versions">${potsFaits} pots mis en cave avec cette recette</div>` : ""}
      ${(ing.length || r.notes) ? `<details><summary>Ingrédients et notes</summary><div class="body">
        ${ing.length ? `<h4>Ingrédients</h4><ul>${ing.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
        ${r.notes ? `<h4>Notes de l'année</h4><p>${esc(r.notes)}</p>` : ""}
      </div></details>` : ""}
      <div class="actions">
        <button class="btn small" data-act="edit-recipe" ${!canWrite ? "disabled" : ""}>Modifier</button>
        ${num(r.annee) !== THIS_YEAR ? `<button class="btn small" data-act="redo" ${!canWrite ? "disabled" : ""}>Refaire en ${THIS_YEAR}</button>` : ""}
        <button class="btn small" data-act="lot-from" ${!canWrite ? "disabled" : ""}>Mettre en pots</button>
      </div>
    </article>`;
  }

  function renderCarnet() {
    if (!state.ready.r) return `<div class="empty"><h3>Ouverture du carnet…</h3><p>Vos recettes, rangées par année, vont apparaître ici.</p></div>`;
    if (!state.recettes.length) return `<div class="empty"><h3>Le carnet est vide</h3><p>Notez votre première recette avec son année : vous pourrez la reprendre et l'ajuster les saisons suivantes.</p><button class="btn primary" data-act="new-recipe">+ Nouvelle recette</button></div>`;
    const list = state.recettes.filter(r => (state.year === "all" || String(r.annee) === String(state.year)) && matches(r, ["nom", "fruits", "ingredients", "notes"]));
    if (!list.length) return `<div class="empty"><p>Aucune recette ne correspond à cette recherche.</p></div>`;
    const byYear = new Map();
    list.forEach(r => { const y = num(r.annee) || 0; if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(r); });
    return [...byYear.keys()].sort((a, b) => b - a).map(y => {
      const rs = byYear.get(y).sort((a, b) => String(a.nom).localeCompare(b.nom, "fr"));
      return `<section class="year"><div class="year-head"><h2>${y || "Sans année"}</h2><span>${rs.length} recette${rs.length > 1 ? "s" : ""}</span></div>
        <div class="recipes">${rs.map(recipeCard).join("")}</div></section>`;
    }).join("");
  }

  function render() {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === state.view)));
    const v = state.view;
    $("#addBtn").textContent = v === "carnet" ? "+ Nouvelle recette" : "+ Nouveau lot";
    $("#addBtn").hidden = v === "etiquettes";
    $("#addBtn").disabled = !canWrite;
    $("#q").hidden = v === "dashboard";
    $("#stats").hidden = v === "dashboard";
    renderStats(); renderYears();
    $("#view").innerHTML = v === "dashboard" ? renderDashboard()
      : v === "etiquettes" ? renderEtiquettes()
      : v === "cellier" ? renderCellier()
      : `<div style="display:grid;gap:32px">${renderCarnet()}</div>`;
    if (v === "etiquettes") drawThumbs();
  }

  // ---------- Formulaires ----------
  const dlg = $("#dlg"), frm = $("#frm");
  let onSave = null;

  function field(id, label, value, opts = {}) {
    const v = esc(value ?? "");
    const cls = opts.wide ? "field wide" : "field";
    let input;
    if (opts.type === "textarea") input = `<textarea id="${id}" name="${id}" placeholder="${esc(opts.ph || "")}">${v}</textarea>`;
    else if (opts.type === "select") input = `<select id="${id}" name="${id}">${opts.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(value ?? "") ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</select>`;
    else input = `<input id="${id}" name="${id}" type="${opts.type || "text"}" value="${v}" ${opts.min != null ? `min="${opts.min}"` : ""} ${opts.max != null ? `max="${opts.max}"` : ""} ${opts.step ? `step="${opts.step}"` : ""} ${opts.list ? `list="${opts.list}" autocomplete="off"` : ""} placeholder="${esc(opts.ph || "")}" ${opts.required ? "required" : ""}>`;
    return `<div class="${cls}"><label for="${id}">${label}</label>${input}${opts.hint ? `<span class="hint">${opts.hint}</span>` : ""}</div>`;
  }

  function openForm(title, fieldsHtml, save, del, submitLabel = "Enregistrer") {
    frm.oninput = null; frm.onchange = null;
    dlg.classList.remove("big");
    frm.innerHTML = `<h2>${esc(title)}</h2><div class="fields">${fieldsHtml}</div><div class="err" id="ferr" hidden></div>
      <div class="form-actions">${del ? `<button type="button" class="btn danger" id="fdel">Supprimer</button>` : ""}
      <div class="right"><button type="button" class="btn" id="fcancel">Annuler</button><button type="submit" class="btn primary" id="fsave">${esc(submitLabel)}</button></div></div>`;
    onSave = save;
    $("#fcancel", frm).onclick = () => dlg.close();
    if (del) {
      const b = $("#fdel", frm);
      b.onclick = async () => {
        if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer la suppression"; return; }
        b.disabled = true;
        try { await del(); dlg.close(); toast("Supprimé"); } catch (e) { showErr(e); b.disabled = false; }
      };
    }
    if (!dlg.open) { if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", ""); }
    const first = frm.querySelector("input,select,textarea"); first && first.focus();
  }
  function showErr(e) {
    const el = $("#ferr", frm); if (!el) return;
    const code = e && e.code;
    el.textContent = code === "quota_exceeded" ? "Le cellier est plein : supprimez d'anciens lots ou recettes avant d'en ajouter."
      : code === "invalid_argument" ? "Vous n'avez pas le droit de modifier ce cellier."
      : (e && e.message) || "L'enregistrement a échoué. Réessayez dans un instant.";
    el.hidden = false;
  }
  frm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(frm).entries());
    const btn = $("#fsave", frm); btn.disabled = true;
    try { const msg = await onSave(data); dlg.close(); toast(msg || "Enregistré"); }
    catch (e) { showErr(e); btn.disabled = false; }
  });

  function recipeOptions() {
    return [{ v: "", t: "— Aucune —" }].concat([...state.recettes].sort((a, b) => num(b.annee) - num(a.annee) || String(a.nom).localeCompare(b.nom, "fr")).map(r => ({ v: r.id, t: `${r.nom} (${r.annee})` })));
  }

  // Numéro proposé pour un parfum : celui de son dernier lot, s'il est encore libre pour l'année choisie.
  function proposeNumero(nom, annee, selfId) {
    const k = norm(String(nom || "").trim());
    if (!k) return { n: "", why: "Saisissez d'abord le parfum." };
    const prev = state.lots.filter(l => l.id !== selfId && norm(l.nom) === k && num(l.numero))
      .sort((a, b) => num(b.annee) - num(a.annee) || String(b.date || "").localeCompare(String(a.date || "")))[0];
    if (!prev) return { n: "", why: "Nouveau parfum : choisissez un numéro." };
    const n = num(prev.numero);
    const used = state.lots.find(l => l.id !== selfId && num(l.annee) === num(annee) && num(l.numero) === n);
    if (used) return { n: "", why: `Le n° ${n} de ce parfum est déjà utilisé en ${num(annee)} (« ${esc(used.nom)} »). Prochain numéro libre : ${nextNumero(annee)}.` };
    return { n, why: `Numéro repris du lot ${esc(lotTitle(prev))} de ${esc(prev.annee)}.` };
  }
  const uniq = (arr) => [...new Map(arr.filter(Boolean).map(v => [norm(String(v).trim()), String(v).trim()])).values()].sort((a, b) => a.localeCompare(b, "fr"));

  function lotForm(l = {}, preset = {}) {
    const d = { annee: THIS_YEAR, date: new Date().toISOString().slice(0, 7), ...preset, ...l };
    const isEdit = !!l.id;
    const P0 = isEdit ? potsOf(l) : null;
    const L0 = isEdit ? lieuxOf(l)
      : (preset.lieux || [{ nom: preset.emplacement || "", pots: { petit: 0, standard: num(preset.nbPots) || 6, grand: 0 } }]);
    let rowSeq = 0;
    const lieuRow = (x) => { const i = rowSeq++; return `<div class="lrow">
        <input id="f_l${i}_nom" class="l-nom" type="text" list="dl_empl" autocomplete="off" placeholder="Cave" value="${esc(x.nom)}" aria-label="Lieu de stockage">
        ${TAILLES.map(t => `<input id="f_l${i}_${t.v}" class="l-n" data-size="${t.v}" type="number" min="0" inputmode="numeric" value="${num(x.pots[t.v]) || 0}" aria-label="${t.pl}">`).join("")}
        <button type="button" class="l-del" aria-label="Retirer ce lieu" title="Retirer ce lieu">×</button></div>`; };
    const potGrid = `${isEdit ? `<div class="field wide"><span class="flabel">Pots remplis au départ</span>
        <div class="remplis">${TAILLES.map(t => `<label for="f_n_${t.v}">${t.t}<input id="f_n_${t.v}" name="f_n_${t.v}" type="number" min="0" inputmode="numeric" value="${P0[t.v].n}"></label>`).join("")}</div></div>` : ""}
      <div class="field wide"><span class="flabel">${isEdit ? "Pots restants par lieu de stockage" : "Pots remplis et lieu de stockage"}</span>
        <div class="lieux" id="f_lieux"><div class="lrow head"><span>Lieu</span>${TAILLES.map(t => `<span>${t.pl}</span>`).join("")}<span></span></div>${L0.map(lieuRow).join("")}</div>
        <div><button type="button" class="btn small" id="f_addlieu">+ Ajouter un lieu</button></div>
        <span class="hint" id="f_tot"></span></div>`;
    const prop = isEdit ? { n: d.numero, why: "" } : proposeNumero(d.nom, d.annee);
    if (!isEdit) d.numero = prop.n;
    const datalist = (id, vals) => `<datalist id="${id}">${vals.map(v => `<option value="${esc(v)}"></option>`).join("")}</datalist>`;
    openForm(isEdit ? "Modifier le lot" : (preset.dupOf ? `Nouveau lot · copie de ${preset.dupOf}` : "Nouveau lot de pots"), [
      field("f_nom", "Parfum", d.nom, { required: true, ph: "Abricot-lavande", list: "dl_nom" }),
      field("f_num", "N° de lot", d.numero, { type: "number", min: 1, hint: `<span id="f_numwhy">${prop.why}</span>` }),
      datalist("dl_nom", uniq(state.lots.map(x => x.nom).concat(state.recettes.map(x => x.nom)))),
      datalist("dl_empl", uniq(state.lots.flatMap(x => lieuxOf(x).map(y => y.nom)))),
      datalist("dl_prov", uniq(state.lots.map(x => x.provenance))),
      field("f_annee", "Année", d.annee, { type: "number", min: 1950, max: 2100 }),
      (() => {
        const dm = /^(\d{4})-(\d{2})/.exec(d.date || "");
        const mo = dm ? dm[2] : "", an = dm ? dm[1] : "";
        return `<div class="field"><label for="f_mois">Mise en pot</label><div class="pair">
          <select id="f_mois" name="f_mois" aria-label="Mois de mise en pot"><option value="">—</option>${MOIS.map((n, i) => { const v = String(i + 1).padStart(2, "0"); return `<option value="${v}" ${v === mo ? "selected" : ""}>${n}</option>`; }).join("")}</select>
          <input id="f_dan" name="f_dan" type="number" min="1950" max="2100" value="${esc(an)}" aria-label="Année de mise en pot"></div></div>`;
      })(),
      potGrid,
      field("f_prov", "Provenance des fruits", d.provenance, { ph: "PARIS", list: "dl_prov" }),
      field("f_rec", "Recette", d.recetteId, { type: "select", options: recipeOptions(), wide: true }),
      field("f_notes", "Notes", d.notes, { type: "textarea", wide: true, ph: "Un peu liquide, à offrir à Noël…" }),
    ].join(""), async (f) => {
      if (!f.f_nom.trim()) throw { message: "Indiquez le parfum." };
      const numero = Math.round(num(f.f_num)) || null;
      const anneeLot = num(f.f_annee) || THIS_YEAR;
      const pris = numero && state.lots.find(o => o.id !== l.id && num(o.numero) === numero && num(o.annee) === anneeLot);
      if (pris) throw { message: `Le lot n° ${numero} existe déjà pour ${anneeLot} (« ${pris.nom} »). Le prochain numéro libre est ${nextNumero(anneeLot)}.` };
      const body = {
        numero, nom: f.f_nom.trim(), annee: num(f.f_annee) || THIS_YEAR, date: f.f_mois && num(f.f_dan) ? `${Math.round(num(f.f_dan))}-${f.f_mois}` : "",
        provenance: (f.f_prov || "").trim().toUpperCase(),
        recetteId: f.f_rec || "", notes: f.f_notes.trim(),
        exemple: false, modifie: new Date().toISOString()
      };
      const lieux = readLieux(), nBy = {};
      TAILLES.forEach(t => { nBy[t.v] = isEdit ? Math.max(0, Math.round(num(f["f_n_" + t.v]))) : lieux.reduce((a, x) => a + x.pots[t.v], 0); });
      Object.assign(body, lotBody(nBy, lieux));
      if (isEdit) await db.collection("lots").doc(l.id).set(body);
      else await db.collection("lots").add(body);
      return isEdit ? "Lot mis à jour" : "Lot ajouté au cellier";
    }, isEdit ? () => db.collection("lots").doc(l.id).delete() : null);
    function readLieux() {
      return [...gf("f_lieux").querySelectorAll(".lrow:not(.head)")].map(r => {
        const pots = {}; TAILLES.forEach(t => { pots[t.v] = Math.max(0, Math.round(num(r.querySelector(`.l-n[data-size="${t.v}"]`).value))); });
        return { nom: r.querySelector(".l-nom").value.trim(), pots };
      }).filter(x => x.nom || lieuTotal(x) > 0);
    }
    const tot = () => {
      const L = readLieux(), r = L.reduce((a, x) => a + lieuTotal(x), 0);
      const n = isEdit ? Math.max(r, TAILLES.reduce((a, t) => a + Math.max(0, num((gf("f_n_" + t.v) || {}).value)), 0)) : r;
      const detail = L.length > 1 ? " (" + L.map(x => `${x.nom || "sans lieu"} : ${lieuTotal(x)}`).join(", ") + ")" : "";
      gf("f_tot").textContent = isEdit ? `Total : ${r} restants${detail} sur ${n} pots remplis.` : `Total : ${n} pot${n > 1 ? "s" : ""}${detail}.`;
    };
    gf("f_addlieu").onclick = () => { gf("f_lieux").insertAdjacentHTML("beforeend", lieuRow({ nom: "", pots: {} })); const rs = gf("f_lieux").querySelectorAll(".l-nom"); rs[rs.length - 1].focus(); tot(); };
    gf("f_lieux").onclick = (ev) => {
      const del = ev.target.closest(".l-del"); if (!del) return;
      del.closest(".lrow").remove();
      if (!gf("f_lieux").querySelector(".lrow:not(.head)")) gf("f_lieux").insertAdjacentHTML("beforeend", lieuRow({ nom: "", pots: {} }));
      tot();
    };
    let numTouched = isEdit;
    frm.oninput = (ev) => {
      const id = ev && ev.target ? ev.target.id : "";
      if (id === "f_num") numTouched = gf("f_num").value !== "";
      if ((id === "f_nom" || id === "f_annee") && !isEdit) {
        const p = proposeNumero(gf("f_nom").value, num(gf("f_annee").value) || THIS_YEAR);
        if (!numTouched) gf("f_num").value = p.n;
        gf("f_numwhy").innerHTML = p.why;
      }
      tot();
    };
    tot();
  }

  function moveForm(lot) {
    const L = lieuxOf(lot);
    const src = L.map((x, i) => ({ i, x })).filter(o => lieuTotal(o.x) > 0);
    if (!src.length) { toast("Ce lot n'a plus de pots à déplacer."); return; }
    const names = uniq(state.lots.flatMap(x => lieuxOf(x).map(y => y.nom)));
    const lname = (x) => x.nom || "Lieu non indiqué";
    openForm(`Déplacer des pots · ${lotTitle(lot)}`, [
      field("m_from", "Depuis", src[0].i, { type: "select", options: src.map(o => ({ v: o.i, t: `${lname(o.x)} (${lieuTotal(o.x)} pots)` })) }),
      field("m_to", "Vers", "", { list: "dl_to", ph: "Placard de la cuisine", required: true, hint: "Un lieu existant ou un nouveau lieu." }),
      `<datalist id="dl_to">${names.map(v => `<option value="${esc(v)}"></option>`).join("")}</datalist>`,
      field("m_size", "Taille des pots", "", { type: "select", options: [] }),
      field("m_n", "Nombre de pots", 1, { type: "number", min: 1 }),
      `<div class="field wide"><span class="hint" id="m_info"></span></div>`,
    ].join(""), async (f) => {
      const from = L[Math.round(num(f.m_from))], to = String(f.m_to || "").trim(), size = f.m_size, n = Math.round(num(f.m_n));
      if (!from) throw { message: "Choisissez le lieu de départ." };
      if (!to) throw { message: "Indiquez le lieu d'arrivée." };
      if (lieuKey(to) === lieuKey(from.nom)) throw { message: "Le lieu d'arrivée doit être différent du lieu de départ." };
      if (!TAILLES.some(t => t.v === size)) throw { message: "Choisissez la taille des pots." };
      if (n < 1) throw { message: "Indiquez au moins 1 pot." };
      if (n > from.pots[size]) throw { message: `Il n'y a que ${from.pots[size]} pot${from.pots[size] > 1 ? "s" : ""} ${tailleLabel(size).toLowerCase()}${from.pots[size] > 1 ? "s" : ""} dans ${lname(from)}.` };
      from.pots[size] -= n;
      let dest = L.find(x => lieuKey(x.nom) === lieuKey(to));
      if (!dest) { dest = { nom: to, pots: { petit: 0, standard: 0, grand: 0 } }; L.push(dest); }
      dest.pots[size] += n;
      const kept = L.filter(x => lieuTotal(x) > 0);
      const P = potsOf(lot), nBy = {}; TAILLES.forEach(t => { nBy[t.v] = P[t.v].n; });
      await db.collection("lots").doc(lot.id).update(lotBody(nBy, kept.length ? kept : [dest]));
      return `${n} pot${n > 1 ? "s" : ""} déplacé${n > 1 ? "s" : ""} vers ${dest.nom}`;
    }, null, "Déplacer");
    const sync = () => {
      const from = L[Math.round(num(gf("m_from").value))] || src[0].x, sel = gf("m_size"), cur = sel.value;
      const ok = TAILLES.filter(t => from.pots[t.v] > 0);
      sel.innerHTML = ok.map(t => `<option value="${t.v}" ${t.v === cur ? "selected" : ""}>${t.pl} (${from.pots[t.v]} dans ce lieu)</option>`).join("");
      const avail = from.pots[sel.value] || 0;
      gf("m_n").max = avail;
      gf("m_info").textContent = `${avail} pot${avail > 1 ? "s" : ""} ${tailleLabel(sel.value).toLowerCase()}${avail > 1 ? "s" : ""} disponible${avail > 1 ? "s" : ""} dans ${lname(from)}.`;
    };
    frm.oninput = (ev) => { if (ev.target.id === "m_from" || ev.target.id === "m_size") sync(); };
    sync();
  }

  function recipeForm(r = {}, opts = {}) {
    const isEdit = !!r.id && !opts.copy;
    const d = { annee: THIS_YEAR, ...r };
    if (opts.copy) { d.annee = THIS_YEAR; d.note = ""; d.notes = ""; }
    openForm(isEdit ? "Modifier la recette" : (opts.copy ? `Refaire en ${THIS_YEAR}` : "Nouvelle recette"), [
      field("r_nom", "Nom", d.nom, { required: true, ph: "Fraise-rhubarbe" }),
      field("r_annee", "Année", d.annee, { type: "number", min: 1950, max: 2100 }),
      field("r_fruits", "Fruits et provenance", d.fruits, { wide: true, ph: "Abricots du Valais, bien mûrs" }),
      field("r_fg", "Fruits préparés (g)", d.fruitsG, { type: "number", min: 0, step: 10, hint: "Poids après dénoyautage." }),
      field("r_sg", "Sucre (g)", d.sucreG, { type: "number", min: 0, step: 10, hint: "Le taux sucre / fruit se calcule seul." }),
      field("r_cuis", "Durée de cuisson (min)", d.cuisson, { type: "number", min: 0 }),
      field("r_rend", "Pots prévus", d.rendement, { type: "number", min: 0 }),
      field("r_ing", "Ingrédients (un par ligne)", d.ingredients, { type: "textarea", wide: true }),
      field("r_notes", "Notes de l'année", d.notes, { type: "textarea", wide: true, ph: "Moins de sucre que l'an dernier, prise parfaite." }),
      field("r_note", "Appréciation", d.note || "", { type: "select", options: [{ v: "", t: "—" }, 1, 2, 3, 4, 5].map(o => typeof o === "object" ? o : { v: o, t: "★".repeat(o) }) }),
    ].join(""), async (f) => {
      if (!f.r_nom.trim()) throw { message: "Indiquez le nom de la recette." };
      const body = {
        nom: f.r_nom.trim(), annee: num(f.r_annee) || THIS_YEAR, fruits: f.r_fruits.trim(),
        fruitsG: num(f.r_fg) || null, sucreG: num(f.r_sg) || null, cuisson: num(f.r_cuis) || null, rendement: num(f.r_rend) || null,
        ingredients: f.r_ing.trim(), etapes: (isEdit && r.etapes) || "", notes: f.r_notes.trim(), note: num(f.r_note) || null,
        exemple: false, modifie: new Date().toISOString()
      };
      if (isEdit) await db.collection("recettes").doc(r.id).set(body);
      else { const ref = await db.collection("recettes").add(body); state.year = "all"; flashId = ref.id; }
      return isEdit ? "Recette mise à jour" : `Recette ${body.annee} ajoutée au carnet`;
    }, isEdit ? () => db.collection("recettes").doc(r.id).delete() : null);
  }

  let flashId = null;

  // ---------- Événements ----------
  document.addEventListener("click", async (ev) => {
    const tab = ev.target.closest(".tab");
    if (tab) { state.view = tab.dataset.view; state.year = "all"; try { localStorage.setItem("cellier.view", state.view); } catch (e) {} render(); return; }
    const chip = ev.target.closest(".chip");
    if (chip && chip.dataset.taille) { state.taille = chip.dataset.taille; render(); return; }
    if (chip && chip.dataset.year) { state.year = chip.dataset.year; render(); return; }
    if (ev.target.closest("#addBtn")) { if (!db) return; state.view === "carnet" ? recipeForm() : lotForm(); return; }

    const b = ev.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    const lotEl = b.closest("[data-lot]"), recEl = b.closest("[data-recipe]");

      evo = `<div class="recipe-evo">${yr(p, rp)}<span class="arrow" aria-hidden="true">→</span>${yr(q, rq)}</div><div class="sub">${esc(q.nom)}${phr ? ` : ${phr} en ${esc(q.annee)}.` : ` : ${esc(p.annee)} et ${esc(q.annee)}.`}</div>`;
    }
    const watchCard = `<div class="dcard"><h2>À surveiller</h2>${watch.length ? `<div>${watch.join("")}</div>` : `<div class="sub">Rien à signaler : aucun lot n'est presque fini.</div>`}${evo}</div>`;

    // Par lieu de stockage
    const places = {};
    rows.forEach(x => {
      const L = lieuxOf(x.l);
      L.forEach(li => {
        const r = lieuTotal(li), k = lieuKey(li.nom);
        if (!r && L.length > 1) return;
        const pl = places[k] = places[k] || { nom: li.nom || "Lieu non indiqué", r: 0, lots: 0, sizes: { petit: 0, standard: 0, grand: 0 }, parfums: new Map(), low: 0 };
        pl.r += r; pl.lots++; if (x.r > 0 && x.r <= 2 && r > 0) pl.low++;
        TAILLES.forEach(t => { pl.sizes[t.v] += li.pots[t.v]; });
        if (r > 0) { const pk = norm(x.l.nom); if (!pl.parfums.has(pk)) pl.parfums.set(pk, { nom: x.l.nom, r: 0 }); pl.parfums.get(pk).r += r; }
      });
    });
    const plist = Object.entries(places).sort((a, b) => (a[0] === "_") - (b[0] === "_") || b[1].r - a[1].r);
    const maxR = Math.max(1, ...plist.map(([, p]) => p.r));
    const placesCard = `<div class="dcard"><h2>Par lieu de stockage</h2><div class="sub">Pots restants dans chaque lieu, par taille et par parfum</div>
      <div class="places">${plist.map(([k, p]) => `<div class="place${k === "_" ? " none" : ""}">
        <div class="pl-head"><b>${esc(p.nom)}</b><span class="pl-n">${p.r}<small> pot${p.r > 1 ? "s" : ""}</small></span></div>
        <div class="lb-track" style="width:${Math.max(4, p.r / maxR * 100).toFixed(1)}%">${TAILLES.filter(t => p.sizes[t.v] > 0).map(t => `<span style="flex:${p.sizes[t.v]};background:${SIZE_COLOR[t.v]}"></span>`).join("") || `<span class="used" style="flex:1"></span>`}</div>
        <span class="note">${TAILLES.filter(t => p.sizes[t.v] > 0).map(t => `${p.sizes[t.v]} ${(p.sizes[t.v] > 1 ? t.pl : t.t).toLowerCase()}`).join(" · ") || "aucun pot restant"} · ${p.lots} lot${p.lots > 1 ? "s" : ""}${p.low ? ` · <span class="pill low">${p.low} bientôt fini${p.low > 1 ? "s" : ""}</span>` : ""}</span>
        ${p.parfums.size ? `<div class="pl-parfums">${[...p.parfums.values()].sort((a, b) => b.r - a.r).map(f => `<span class="pl-chip">${esc(f.nom)} <b>${f.r}</b></span>`).join("")}</div>` : ""}
      </div>`).join("")}</div>
      ${places._ ? `<span class="hint">Indiquez le lieu de stockage dans « Modifier » pour ranger les lots sans lieu.</span>` : ""}</div>`;

    return `<div class="dash">${kpis}<div class="dash-row">${lotBars}${donut}</div>${placesCard}<div class="dash-row b">${vint}${watchCard}</div></div>`;
  }

  // ---------- Onglet Étiquettes ----------
  const SAMPLE_LOT = { numero: 1, nom: "Abricot-lavande", annee: THIS_YEAR, date: `${THIS_YEAR}-07`, provenance: "PARIS", pots: { standard: { n: 6, r: 6 } } };
  function sampleLot() { return [...state.lots].sort(SORTS.numero)[0] || SAMPLE_LOT; }
  function renderEtiquettes() {
    const tpls = [...(state.modeles || [])].sort((a, b) => String(a.nom).localeCompare(b.nom, "fr"));
    const def = (state.modele && state.modele.tplId) || "";
    const card = (id, name, fmtLabel, actions) => `<article class="tplcard"><div class="thumb"><canvas data-thumb="${esc(id)}" aria-label="Aperçu du modèle ${esc(name)}"></canvas></div>
      <div class="tpl-info"><b>${esc(name)}</b>${(id === "auto" ? !def : def === id) ? ` <span class="pill ex">Par défaut</span>` : ""}<span class="hint">${esc(fmtLabel)}</span></div>${actions}</article>`;
    const tplCards = [card("auto", "Modèle automatique", fmtById((state.modele || {}).format).t, `<span class="hint">Mise en page calculée à partir des informations du lot.</span>`)]
      .concat(tpls.map(t => card(t.id, t.nom || "Sans nom", fmtById(t.format).t, canWrite ? `<div class="actions"><button class="btn small" data-act="tpl-edit" data-tpl="${esc(t.id)}">Modifier</button></div>` : ""))).join("");
    const lots = state.lots.filter(l => (state.year === "all" || String(l.annee) === String(state.year)) && matches(l, ["numero", "nom", "provenance", "notes"])).sort(SORTS[state.sort] || SORTS.numero);
    const lotRows = lots.map(l => { const p = potsOf(l); const parts = TAILLES.filter(t => p[t.v].n > 0).map(t => `${p[t.v].n} ${(p[t.v].n > 1 ? t.pl : t.t).toLowerCase()}`).join(" · ");
      return `<div class="lotrow" data-lot="${esc(l.id)}"><div><b>${esc(lotTitle(l))}</b><span class="hint">${esc(moisAnnee(l))}${l.provenance ? " · " + esc(l.provenance) : ""}${parts ? " · " + parts : ""}</span></div>
        <button class="btn small primary" data-act="labels">Créer les étiquettes</button></div>`; }).join("");
    return `<div class="etq">
      <section class="etq-sec"><div class="sec-head"><h2>Modèles d'étiquettes</h2>${canWrite && assets ? `<button class="btn small" data-act="tpl-new">+ Importer un modèle</button>` : ""}</div>
        <div class="tplgrid">${tplCards}</div>
        ${!assets && canWrite ? `<span class="hint">L'import de modèles n'est pas disponible dans cet affichage.</span>` : ""}</section>
      <section class="etq-sec"><div class="sec-head"><h2>Imprimer des étiquettes</h2><span class="hint">Choisissez un lot : le modèle, la planche et le nombre d'étiquettes se règlent ensuite.</span></div>
        ${!state.ready.l ? `<div class="empty"><p>Chargement des lots…</p></div>` : (lots.length ? `<div class="lotlist">${lotRows}</div>` : `<div class="empty"><p>${state.lots.length ? "Aucun lot ne correspond à cette recherche." : "Ajoutez d'abord un lot dans le Cellier."}</p></div>`)}</section>
    </div>`;
  }
  function drawThumbs() {
    document.querySelectorAll("canvas[data-thumb]").forEach(cv => {
      const id = cv.dataset.thumb, tpl = id === "auto" ? null : (state.modeles || []).find(t => t.id === id);
      if (id !== "auto" && !tpl) return;
      const f = fmtById(tpl ? tpl.format : (state.modele || {}).format);
      const cssW = Math.max(120, Math.min(260, (cv.parentElement.clientWidth || 240) - 16)), k = cssW / f.w, cssH = f.h * k, dpr = window.devicePixelRatio || 1;
      cv.style.width = cssW + "px"; cv.style.height = cssH + "px"; cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
      cv.classList.toggle("round", !!f.round);
      const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cssW, cssH);
      const lot = sampleLot(), rec = lot.recetteId && state.recettes.find(r => r.id === lot.recetteId);
      if (tpl) {
        const entry = tpl.assetId ? getImg(tpl.assetId) : null;
        if (entry && !entry.ready && !entry.error) entry.wait.add(drawThumbs);
        drawCustomLabel(canvasPainter(ctx, k), 0, 0, f, lot, rec, tpl, entry);
      } else drawLabel(canvasPainter(ctx, k), 0, 0, f, lot, rec, { ...MODELE_DEF, ...state.modele });
    });
  }

  let qt; $("#q").addEventListener("input", (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120); });

  // ---------- Données ----------
  render();
  (async () => {
    if (!window.claude || typeof window.claude.use !== "function") {
      notice("L'enregistrement n'est pas disponible dans cet affichage. Ce navigateur ne permet pas d'enregistrer les données. Ouvrez l'application dans Safari.");
      canWrite = false; state.ready = { r: true, l: true }; render(); return;
    }
    db = await window.claude.use("db");
    if (!db) {
      notice("Ce navigateur ne permet pas d'enregistrer les données (navigation privée ?). Ouvrez l'application depuis son icône sur l'écran d'accueil.");
      canWrite = false; state.ready = { r: true, l: true }; render(); return;
    }
    try {
      const user = await window.claude.use("user");
      if (user && typeof user.can === "function") { const w = await user.can("data.write"); if (w === false) { canWrite = false; notice("Vous consultez ce cellier en lecture seule."); } }
    } catch (e) {}
    const onErr = (e) => { if (e && e.code !== "revoked") notice("Le cellier ne se met plus à jour. Rechargez la page."); };
    db.collection("recettes").onSnapshot((snap) => {
      state.recettes = snap.docs.map(d => ({ id: d.id, ...d.data() })); state.ready.r = true; render();
      if (flashId) { const id = flashId; flashId = null; if (state.view === "carnet") goToRecipe(id); }
    }, onErr);
    try { assets = await window.claude.use("assets"); } catch (e) { assets = null; }
    db.collection("modeles").onSnapshot((snap) => { state.modeles = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (state.view === "etiquettes") render(); }, () => {});
    db.doc("reglages/etiquettes").onSnapshot((s) => { state.modele = s.exists ? { ...MODELE_DEF, ...s.data() } : { ...MODELE_DEF }; if (state.view === "etiquettes") render(); }, () => {});
    loadLabelFonts().then(() => { if (state.view === "etiquettes") drawThumbs(); });
    db.collection("lots").onSnapshot((snap) => {
      state.lots = snap.docs.map(d => ({ id: d.id, ...d.data() })); state.ready.l = true; render();
    }, onErr);
  })();
})();
</script>
</body>
</html>
