<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Cave">
<meta name="theme-color" content="#5c1622">
<title>Ma Cave</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f6f1ea; --surface:#fffdf9; --surface2:#efe7dc; --text:#2a1f1c; --muted:#7b6a63;
  --accent:#7a1f2b; --accent2:#5c1622; --line:#e2d6c8; --ok:#2f7a4a; --warn:#b5701b; --bad:#a3281f;
  --rouge:#a8283b; --blanc:#c99a1c; --rose:#e06d8a; --eff:#2a78d6; --liq:#c4610f; --autre:#7468b8;
  --slate:#5f7790; --none:#b9ada3; --grid:#efe6da; --axis:#cdbfae;
  --shadow:0 1px 2px rgba(60,30,20,.06),0 4px 14px rgba(60,30,20,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#17110f;--surface:#221a17;--surface2:#2d2320;--text:#f3e9e2;--muted:#b0a097;--accent:#c9505f;--accent2:#5c1622;--line:#3a2e2a;--shadow:none;
    --rouge:#d0465a;--blanc:#b8890f;--rose:#d55181;--eff:#3987e5;--liq:#d9772a;--autre:#9085e9;--slate:#7f97b0;--none:#5b4f4a;--grid:#2e2421;--axis:#4a3d38}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button,label.btn{touch-action:manipulation}
header{position:sticky;top:0;z-index:10;background:var(--accent2);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 20px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1200px;margin:0 auto}
h1{margin:0;font:600 26px/1.1 "Georgia","Times New Roman",serif;letter-spacing:.3px}
h1 small{display:block;font:400 13px -apple-system,sans-serif;opacity:.75;margin-top:3px}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;min-height:46px}
.btn.light{background:rgba(255,255,255,.16)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--bad)}
nav{display:flex;gap:4px;max-width:1200px;margin:12px auto 0;overflow-x:auto}
nav button{background:none;border:0;color:rgba(255,255,255,.7);padding:12px 16px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:#fff}
main{max-width:1200px;margin:0 auto;padding:18px 20px calc(env(safe-area-inset-bottom) + 40px)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.search{flex:1 1 260px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:46px}
select.f{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:46px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:7px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);flex:none}
.summary{color:var(--muted);font-size:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;overflow:hidden;cursor:pointer}
.card .band{width:7px;flex:none}
.card .ph{width:78px;flex:none;background:var(--surface2) center/cover no-repeat}
.card .body{flex:1;padding:12px 14px;min-width:0}
.card .name{font:600 18px/1.2 Georgia,serif;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface2)}
.b-ok{background:rgba(47,122,74,.14);color:var(--ok)}
.b-warn{background:rgba(181,112,27,.15);color:var(--warn)}
.b-bad{background:rgba(163,40,31,.14);color:var(--bad)}
.qty{display:flex;align-items:center;gap:6px;padding:12px 12px 12px 0}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:22px;line-height:1;cursor:pointer}
.qty b{min-width:30px;text-align:center;font-size:20px}
.qty.zero b{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .big{font:600 22px Georgia,serif;color:var(--text);margin-bottom:8px}
/* modal */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;-webkit-overflow-scrolling:touch;background:rgba(20,10,8,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 16px}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font:600 21px Georgia,serif}
.mb{padding:18px 20px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{flex:1}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fl{display:flex;flex-direction:column;gap:5px;grid-column:span 3}
.fl.s2{grid-column:span 2}.fl.s6{grid-column:span 6}.fl.s1{grid-column:span 1}
.fl label{font-size:13px;color:var(--muted);font-weight:600}
.fl input,.fl select,.fl textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px;width:100%}
.fl textarea{min-height:80px;resize:vertical}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:30px;color:var(--line);padding:0 2px;cursor:pointer}
.stars button.on{color:#d3a12c}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:90px;height:120px;border-radius:10px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line)}
.sec{font:600 15px Georgia,serif;color:var(--accent);grid-column:span 6;margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
/* detail */
.dt{display:flex;gap:18px;flex-wrap:wrap}
.dt .bigph{width:160px;height:220px;border-radius:12px;background:var(--surface2) center/cover no-repeat;flex:none}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;flex:1;min-width:260px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
/* journal / stats */
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:15px}
th{background:var(--surface2);font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi .v{font:600 30px Georgia,serif}.kpi .l{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font:600 18px Georgia,serif}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.bar .lab{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:1;height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar .n{width:46px;text-align:right;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* tableau de bord */
.dfil{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.dnote{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);min-height:40px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.kpi.tap{cursor:pointer}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash .panel{margin:0;min-width:0}
.dash .full{grid-column:1/-1}
.panel .sub{color:var(--muted);font-size:13px;margin:-6px 0 14px}
.nodata{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.tap{cursor:pointer}
.hbr{display:grid;grid-template-columns:minmax(80px,36%) 1fr auto;gap:10px;align-items:center;min-height:36px;font-size:14px;border-radius:8px;padding:0 6px;margin:0 -6px}
.hbr.tap:active,.lgr.tap:active,tr.tap:active{background:var(--surface2)}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:12px;background:var(--grid);border-radius:4px;overflow:hidden}
.hbf{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hbv{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbv small,.lgv small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px;display:inline-block;min-width:34px;text-align:right}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{flex:none}
.donut .dv{font:600 24px Georgia,serif;fill:var(--text)}.donut .dl{font-size:11px;fill:var(--muted)}
.lg{flex:1;min-width:190px}
.lgr{display:flex;align-items:center;gap:10px;min-height:36px;font-size:14px;padding:0 6px;margin:0 -6px;border-radius:8px}
.lgl{flex:1}.lgv{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{width:22px;height:22px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mat{display:flex;gap:2px;height:22px;margin-bottom:14px}
.mat span{border-radius:4px;min-width:3px}
.clg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.clg span{display:inline-flex;align-items:center;gap:6px}
.cc{display:grid;grid-template-columns:44px 1fr;grid-template-rows:210px auto;column-gap:8px}
.ccy{position:relative;font-size:11px;color:var(--muted)}
.ccy span{position:absolute;right:0;transform:translateY(50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.ccp{position:relative;border-bottom:1px solid var(--axis)}
.ccp i{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.ccc{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;min-width:0;border-radius:6px 6px 0 0}
.col.sel,.col:hover{background:var(--grid)}
.col .stk{width:min(72%,30px);display:flex;flex-direction:column-reverse;gap:2px}
.col .stk span{display:block;min-height:2px}
.col .stk span:last-child{border-radius:4px 4px 0 0}
.ccx{display:flex;gap:2px;font-size:11px;color:var(--muted);margin-top:5px}
.ccx span{flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:visible}
table.wt td{font-size:14px}
table.wt .r{text-align:right;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:60;display:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:12px 14px;font-size:14px;width:max-content;max-width:290px}
#tip .tt{font-weight:600;margin-bottom:6px}
#tip .tr{display:flex;align-items:center;gap:8px;margin:3px 0}
#tip .tr b{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
#tip .tr.tot{border-top:1px solid var(--line);padding-top:4px;color:var(--muted)}
#tip .tw{color:var(--muted);font-size:13px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px;line-height:1.5}
#tip .btn{margin-top:10px;min-height:40px;padding:8px 12px;width:100%}
@media (max-width:820px){ .dash{grid-template-columns:1fr} .wt .hn{display:none} }
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.install{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;box-shadow:var(--shadow)}
.install .x{margin-left:auto}
.install.bk{border-color:rgba(181,112,27,.45);background:rgba(181,112,27,.08);flex-wrap:wrap}
.bkico{font-size:28px;line-height:1;color:var(--warn)}
nav button.due::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#f0b44c;margin-left:6px;vertical-align:2px}
.panel .ok{color:var(--ok);font-weight:600}.panel .due{color:var(--warn);font-weight:600}
.warnbox{background:rgba(181,112,27,.12);border:1px solid rgba(181,112,27,.35);color:var(--text);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.scan{grid-column:span 6;background:var(--surface2);border-radius:12px;padding:14px;border:1px dashed var(--line)}
.scan h4{margin:0 0 4px;font:600 16px Georgia,serif;color:var(--accent)}
.scan .hint{font-size:13px;color:var(--muted);margin:4px 0 10px;line-height:1.45}
.scan textarea{width:100%;min-height:110px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;resize:vertical}
.scan .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.scan details{font-size:13px;color:var(--muted);margin-top:8px}
.scan summary{cursor:pointer;font-weight:600}
#scanRes{font-size:14px;font-weight:600;margin-top:8px;min-height:1em}
.fl .auto{background:rgba(211,161,44,.16)!important;border-color:#d3a12c!important}
@media (max-width:700px){
  .form{grid-template-columns:1fr 1fr}.fl,.fl.s2,.fl.s6,.fl.s1,.sec,.scan{grid-column:span 2}
  .two{grid-template-columns:1fr}.grid{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Ma Cave<small id="hdrSum">—</small></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn light" id="scanBtn">📷 Scanner une étiquette</button>
      <button class="btn light" id="addBtn">＋ Ajouter un vin</button>
    </div>
  </div>
  <nav id="tabs">
    <button data-v="cave" class="on">Cave</button>
    <button data-v="stats">Tableau de bord</button>
    <button data-v="journal">Journal</button>
    <button data-v="save">Sauvegarde</button>
  </nav>
</header>
<main id="main"></main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="tip" role="tooltip"></div>

<script>
/* Détecteur d'erreurs : affiche un message clair au lieu d'une app bloquée. */
(function(){
  function osInfo(){ var u=navigator.userAgent, m=u.match(/OS (\d+)_(\d+)/), v=u.match(/Version\/(\d+(\.\d+)?)/);
    return (m ? "iPadOS/iOS "+m[1]+"."+m[2] : (v ? "Safari "+v[1] : "navigateur inconnu")); }
  function show(msg){
    var b=document.getElementById("errbox");
    if(!b){ b=document.createElement("div"); b.id="errbox";
      b.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:999;background:#a3281f;color:#fff;padding:14px 16px;border-radius:12px;font:14px/1.45 -apple-system,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.3)";
      document.body.appendChild(b); }
    b.innerHTML="<b>Ma Cave a rencontré un problème.</b><br>Faites une capture d'écran de ce message et envoyez-la pour qu'il soit corrigé.<br><span style='opacity:.85;font-size:12px'>"+String(msg).replace(/</g,"&lt;")+" · "+osInfo()+" · v1.1.2</span>";
  }
  window.__caveShowError=show;
  window.addEventListener("error",function(e){ show((e.message||"Erreur")+(e.lineno?" (ligne "+e.lineno+")":"")); });
  window.addEventListener("unhandledrejection",function(e){ show("Promesse : "+(e.reason&&e.reason.message||e.reason)); });
  window.addEventListener("load",function(){ if(!window.__caveOK) show("L'application n'a pas pu démarrer sur cet appareil."); });
})();
</script>
<script>
"use strict";
const KEY = "ma-cave-v1";
const APP_VERSION = "1.1.2";
const isStandalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function showInstallHint(){ if(isStandalone() || !isIOS() || !location.protocol.startsWith("http")) return false; try{ return !localStorage.getItem(KEY+"-hint"); }catch(e){ return true; } }
const COLORS = [
  {k:"rouge",l:"Rouge",c:"var(--rouge)"},{k:"blanc",l:"Blanc",c:"var(--blanc)"},{k:"rose",l:"Rosé",c:"var(--rose)"},
  {k:"effervescent",l:"Effervescent",c:"var(--eff)"},{k:"liquoreux",l:"Liquoreux / Doux",c:"var(--liq)"},{k:"autre",l:"Autre",c:"var(--autre)"}
];
const colOf = k => COLORS.find(c=>c.k===k) || COLORS[5];
const YEAR = () => new Date().getFullYear();

let storageOK = true;
let db = {wines:[], log:[], savedAt:null};
let ui = {view:"cave", q:"", colors:new Set(), region:"", status:"", sort:"nom", showEmpty:false, facet:null, dm:"btl", dc:"", dwTab:"btl"};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); db.wines = d.wines||[]; db.log = d.log||[]; db.savedAt = d.savedAt||null; }
    localStorage.setItem(KEY+"-test","1"); localStorage.removeItem(KEY+"-test");
  }catch(e){ storageOK = false; }
}
function save(){
  db.savedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; noteChange(); }
  catch(e){ storageOK = false; toast("⚠️ Enregistrement impossible (stockage plein ou bloqué) — exportez une sauvegarde"); }
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (Number(n)||0).toLocaleString("fr-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString("fr-CH",{day:"2-digit",month:"2-digit",year:"numeric"}); }catch(e){ return iso; } };
const $ = s => document.querySelector(s);

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }

function status(w){
  const y = YEAR(), a = parseInt(w.boireDe), b = parseInt(w.boireA);
  if(!a && !b) return {k:"", l:"", cls:""};
  if(a && y < a) return {k:"garder", l:"À garder (dès "+a+")", cls:"b-warn"};
  if(b && y > b) return {k:"passe", l:"Apogée dépassée", cls:"b-bad"};
  if(b && y === b) return {k:"vite", l:"À boire cette année", cls:"b-bad"};
  return {k:"boire", l:"À boire", cls:"b-ok"};
}
const totalBottles = () => db.wines.reduce((s,w)=>s+(+w.quantite||0),0);
const totalValue = () => db.wines.reduce((s,w)=>s+(+w.quantite||0)*(+w.prix||0),0);

function renderHeader(){
  const n = totalBottles(), r = db.wines.filter(w=>+w.quantite>0).length;
  $("#hdrSum").textContent = n+" bouteille"+(n>1?"s":"")+" · "+r+" référence"+(r>1?"s":"");

/* ---------- CAVE ---------- */
function filtered(){
  const q = ui.q.trim().toLowerCase();
  let list = db.wines.filter(w=>{
    if(!ui.showEmpty && !(+w.quantite>0)) return false;
    if(ui.colors.size && !ui.colors.has(w.couleur)) return false;
    if(ui.region && (w.region||"") !== ui.region) return false;
    if(ui.status){ const s=status(w).k; if(ui.status==="boire" ? !(s==="boire"||s==="vite"||s==="passe") : s!==ui.status) return false; }
    if(ui.facet){ const {k,v} = ui.facet;
      if(k==="cepage"){ if(!(w.cepages||"").split(",").map(s=>s.trim()).includes(v)) return false; }
      else if(String(w[k]||"").trim()!==v) return false; }
    if(q){ const hay=[w.nom,w.domaine,w.appellation,w.region,w.pays,w.cepages,w.millesime,w.emplacement,w.commentaire].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const s = ui.sort;
  list.sort((a,b)=>{
    if(s==="millesime") return (+a.millesime||9999)-(+b.millesime||9999);
    if(s==="millesimeDesc") return (+b.millesime||0)-(+a.millesime||0);
    if(s==="quantite") return (+b.quantite||0)-(+a.quantite||0);
    if(s==="note") return (+b.note||0)-(+a.note||0);
    if(s==="apogee") return (+a.boireA||9999)-(+b.boireA||9999);
    if(s==="emplacement") return (a.emplacement||"~").localeCompare(b.emplacement||"~","fr",{numeric:true});
    if(s==="ajout") return (b.ajoute||"").localeCompare(a.ajoute||"");
    return (a.nom||"").localeCompare(b.nom||"","fr");
  });
  return list;
}

function adjust(id, delta, motif, note){
  const w = db.wines.find(x=>x.id===id); if(!w) return;
  const before = +w.quantite||0, after = Math.max(0, before+delta);
  if(after===before) return;
  w.quantite = after;
  db.log.unshift({id:uid(), wineId:w.id, nom:w.nom, millesime:w.millesime, date:new Date().toISOString(), delta:after-before, motif, note:note||""});
  save(); renderHeader(); render();
  toast((after-before>0?"+":"")+(after-before)+" · "+(w.nom||"Vin")+" → "+after+" en cave");
}

/* ---------- Label scan : texte de l'étiquette → champs ---------- */
const norm = s => String(s||"").replace(/[œŒ]/g,"oe").replace(/[æÆ]/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"")
  .toLowerCase().replace(/[’‘`´]/g,"'").replace(/[-–—_]/g," ").replace(/[ \t]+/g," ").trim();
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const wb = (k, fl="") => new RegExp("(^|[^a-z0-9])"+reEsc(k)+"(?=[^a-z0-9]|$)", fl);
const maskW = (s, k) => s.replace(wb(k,"g"), (m,p)=>p+" ".repeat(m.length-p.length));
function tidy(s){
  s = String(s||"").replace(/^[\s\-–•*·.,:;|]+|[\s\-–•*·.,:;|]+$/g,"").replace(/\s+/g," ");
  const letters = s.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,"");
  if(letters.length>1 && letters===letters.toUpperCase()){
    s = s.toLowerCase().replace(/(^|[\s\-'’(])([a-zà-öø-ÿ])/g,(m,a,b)=>a+b.toUpperCase())
      .replace(/(\s)(De|Du|Des|La|Le|Les|Et|En|Sur|Sous|Aux|Au|Di|Del|Della|Da|Y|Von|Und)(?=\s)/g,(m,a,w)=>a+w.toLowerCase())
      .replace(/(^|\s)(D|L)(['’])/g,(m,a,b,c)=>a+b.toLowerCase()+c);
    s = s.charAt(0).toUpperCase()+s.slice(1);
  }
  return s;
}

  r:"Cabernet Sauvignon;Cabernet Franc;Merlot;Pinot Noir;Gamay;Syrah;Shiraz;Grenache;Mourvèdre;Carignan;Cinsault;Malbec;Tannat;Nebbiolo;Sangiovese;Barbera;Dolcetto;Corvina;Primitivo;Zinfandel;Tempranillo;Garnacha;Nero d'Avola;Aglianico;Touriga Nacional;Cornalin;Humagne Rouge;Gamaret;Garanoir;Diolinoir;Mondeuse;Trousseau;Poulsard;Pinotage;Carménère;Petit Verdot;Blaufränkisch;Zweigelt;Spätburgunder;Mencía",
  b:"Chardonnay;Sauvignon Blanc;Sauvignon Gris;Sauvignon;Chenin Blanc;Chenin;Riesling;Gewurztraminer;Pinot Gris;Pinot Blanc;Pinot Grigio;Muscat;Viognier;Marsanne;Roussanne;Sémillon;Muscadelle;Melon de Bourgogne;Aligoté;Chasselas;Fendant;Petite Arvine;Amigne;Humagne Blanche;Heida;Païen;Johannisberg;Sylvaner;Silvaner;Savagnin;Jacquère;Altesse;Vermentino;Rolle;Picpoul;Grüner Veltliner;Albariño;Verdejo;Garganega;Glera;Trebbiano;Fiano;Greco;Furmint;Müller-Thurgau;Doral;Malvoisie;Grenache Blanc;Clairette;Ugni Blanc;Gros Manseng;Petit Manseng"
};
const GRAPE_CH = {"fendant":"Valais","cornalin":"Valais","petite arvine":"Valais","amigne":"Valais","humagne rouge":"Valais","humagne blanche":"Valais","heida":"Valais","paien":"Valais","johannisberg":"Valais","gamaret":"CH","garanoir":"CH","diolinoir":"CH","doral":"CH"};
const GRAPES = Object.entries(GRAPE_SRC).flatMap(([c,s])=>s.split(";").map(name=>({name,c,key:norm(name),ch:GRAPE_CH[norm(name)]}))).sort((a,b)=>b.key.length-a.key.length);
const COUNTRY_WORDS = /(^|[^a-z])(france|suisse|switzerland|schweiz|svizzera|italia|italy|italie|espana|spain|espagne|portugal|deutschland|germany|allemagne|osterreich|austria|autriche)([^a-z]|$)/g;

function analyzeLabel(raw){
  const Y = YEAR(), out = {};
  const lines = String(raw||"").split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l.length>1);
  if(!lines.length) return out;
  const nl = lines.map(norm);
  const BOIL = /(mis en bouteille|mise en bouteille|bottled|imbottigliat|embotellad|abgefullt|contient|contains|contiene|sulfit|solfit|allerg|produit de|product of|produce of|prodotto|producto|vin de france|vin suisse|vino d'italia|wine of|\bvol\b|%|\bcl\b|\bml\b|www|@|\.com|\.ch|\.fr|\.it|\btel\b|\bfax\b|import|appellation|controlee|controllata|garantita|protegee|denominazione|denominacion|\baoc\b|\baop\b|\bdoc\b|\bdocg\b|\bigp\b|\bigt\b|enceinte|pregnant|gravidanza|\blot\b|recycl|\bsarl\b|\bsas\b|\bscea\b|\bgfa\b|\bsa\b|propriet|recoltant|negociant|cru classe|cru bourgeois|premier grand cru|grand vin)/;
  const DOM = /(^|[^a-z])(chateau|domaine|clos|mas|cave|caves|maison|tenuta|bodegas?|weingut|cantina|quinta|abbaye|cellier|vignobles?|famille|azienda|fattoria|castello|podere|schloss|weinkellerei)([^a-z]|$)/;
  const APPL = /(appellation|\baoc\b|\baop\b|\bdoc\b|\bdocg\b|\bdoca?\b|\bigp\b|controlee|controllata|protegee|denominazione|denominacion|1er cru|premier cru|grand cru)/;
  const ADDR = /(\b\d{4,5} [a-z]|mis en bouteille|mise en bouteille|bottled|imbottigliat|embotellad|\brue\b|\broute\b|\bchemin\b|\bavenue\b|\btel\b)/;

  // Appellation (dictionnaire, la plus spécifique, de préférence sur la ligne « appellation… »)
  let best = null; const masked = nl.slice();
  for(const a of APPS){
    const re = wb(a.key);
    masked.forEach((l,i)=>{
      if(re.test(l)){
        const sc = a.key.length + (APPL.test(nl[i])?100:0) - (ADDR.test(nl[i])?60:0);
        if(!best || sc>best.sc) best = {a,i,sc};
        masked[i] = maskW(l, a.key);
      }
    });
  }
  let appName = "";
  if(!best || best.sc<100){ // appellation hors dictionnaire : « Appellation X Contrôlée », « AOC X », « X DOC »…
    for(const l of lines){
      const m = l.match(/appellation\s+(.+?)\s+(contr[oô]l[ée]e|prot[ée]g[ée]e|d'origine)/i) || l.match(/\b(?:AOC|AOP|DOCG|DOCa|DOC|IGP|IGT)\s*[:\-–]?\s*([A-ZÀ-Þ][^\d,;()]{2,40})/) || l.match(/([A-ZÀ-Þ][^\d,;()]{2,40}?)\s+(?:AOC|AOP|DOCG|DOC|IGP|IGT)\b/);
      if(m){
        const cand = tidy(m[1]); const nc = norm(cand);
        if(cand.length>2){ const hit = APPS.find(a=>wb(a.key).test(nc)); if(hit) best = {a:hit, i:lines.indexOf(l), sc:200}; else { appName = cand; best = null; } }
        break;
      }
    }
  }
  if(best){
    appName = best.a.name;
    const here = nl[best.i], next = (nl[best.i+1]||"").trim();
    if(!/cru/.test(best.a.key)){
      if(/(1er|premier) cru/.test(here) || /^(1er|premier) cru$/.test(next)) appName += " Premier Cru";
      else if(best.a.region!=="Bordeaux" && (/grand cru(?! classe)/.test(here) || /^grand cru$/.test(next))) appName += " Grand Cru";
    }
    out.region = best.a.region; out.pays = best.a.pays;
  }
  if(appName) out.appellation = appName;

  // Millésime
  let yb = null;
  nl.forEach(l=>{
    const re = /(^|[^0-9])((?:19|20)\d\d)(?![0-9])/g; let m;
    while((m=re.exec(l))){
      const y = +m[2]; if(y<1900 || y>Y) continue;
      const pre = l.slice(0, m.index+m[1].length).trim();
      if(/(^|[^a-z])(depuis|since|dal|desde|seit|fonde|fondee|founded|est|en|in|anno|cree|creation|famille depuis)\.?$/.test(pre) || /(©|\(c\))$/.test(pre)) continue;
      if(l!==m[2] && ADDR.test(l)) continue;
      let sc = 1; if(l===m[2]) sc += 3;
      if(/(millesime|vintage|annata|cosecha|jahrgang|vendange|harvest|recolte)\s*:?$/.test(pre)) sc += 3;
      if(!yb || sc>yb.sc) yb = {y:m[2], sc};
    }
  });
  if(yb) out.millesime = yb.y;

  // Contenance & degré
  const all = nl.join("\n"); let m;
  const vre = /(^|[^0-9.,])(\d{1,4}(?:[.,]\d{1,3})?)\s*(cl|ml|l|lt|litres?|liters?|litri)(?![a-z])/g;
  while((m=vre.exec(all))){
    const v = parseFloat(m[2].replace(",",".")), u = m[3];
    const cl = u==="cl" ? v : u==="ml" ? v/10 : v*100;
    if(cl>=18 && cl<=1500){ out.contenance = cl===150?"150 cl (Magnum)":cl===300?"300 cl (Jéroboam)":(Math.round(cl*10)/10+" cl"); break; }
  }
  const dre = /(^|[^0-9.,])(\d{1,2}(?:[.,]\d{1,2})?)\s*%/g;
  while((m=dre.exec(all))){ const v = parseFloat(m[2].replace(",",".")); if(v>=5 && v<=23){ out.degre = String(v).replace(".",","); break; } }

  // Cépages (après avoir retiré les appellations, ex. « Mont-sur-Rolle » ≠ Rolle)
  let gtext = masked.join("\n"); const grapes = [], gcol = {r:0,b:0}; let swiss = null;
  for(const g of GRAPES){ if(wb(g.key).test(gtext)){ grapes.push(g.name); gcol[g.c]++; swiss = swiss || g.ch; gtext = maskW(gtext, g.key); } }
  if(grapes.length) out.cepages = grapes.join(", ");
  const gl = gtext.split("\n");

  // Couleur
  const anyL = re => gl.some((l,i)=>!DOM.test(nl[i]) && re.test(l));
  const app = best && best.a; let col = "";
  if((app&&app.c)==="e" || anyL(/(^|[^a-z])(brut|extra brut|brut nature|demi sec|mousseux|cremant|methode traditionnelle|methode champenoise|methode classique|spumante|sekt|petillant|blanc de blancs|blanc de noirs|sparkling|cava|prosecco|champagne)([^a-z]|$)/)) col = "effervescent";
  else if((app&&app.c)==="l" || anyL(/(liquoreux|moelleux|vendanges? tardives?|grains nobles|late harvest|passito|vin doux naturel|vino dulce|tokaji|eiswein|icewine|vin de paille|tawny)/)) col = "liquoreux";
  else if((app&&app.c)==="o" || anyL(/(^|[^a-z])(rose|rosato|rosado|oeil de perdrix|blush)([^a-z]|$)/)) col = "rose";
  else {
    const ex = gl.map((l,i)=>DOM.test(nl[i])?"":l.trim());
    if(ex.some(l=>/(^|\s)(blanc|bianco|blanco|weisswein)$|white wine|^white$/.test(l))) col = "blanc";
    else if(ex.some(l=>/(^|\s)(rouge|rosso|tinto|rotwein)$|red wine|^red$/.test(l))) col = "rouge";
    else if(app&&app.c) col = app.c;
    else if(gcol.r || gcol.b) col = gcol.r>=gcol.b ? "rouge" : "blanc";
  }
  if(col) out.couleur = col;

  // Domaine / producteur
  let domI = -1;
  for(let i=0;i<lines.length;i++){
    if(DOM.test(masked[i]) && !/(mis|mise) en bouteille|bottled|imbottigliat|embotellad|abgefullt/.test(nl[i]) && lines[i].length<=50){ domI = i; break; }
  }
  if(domI>=0) out.domaine = tidy(lines[domI]);
  else for(const l of lines){
    const mm = l.match(/(?:mis en bouteille|mise en bouteille|bottled|imbottigliato|embotellado|abgefüllt)[^,]*?\b(?:par|by|da|por|von|chez)\s+([^,;]+)/i);
    if(mm){ const d = tidy(mm[1].replace(/\b(SCEA|SCA|SARL|SAS|SA|GFA|EARL|GAEC)\b\.?/g,"").replace(/\s+(à|a|in|en)\s+[A-ZÀ-Þ].*$/,"")); if(d.length>2) out.domaine = d; break; }
  }

  // Nom / cuvée
  const EXCL = /^(blanc|rouge|rose|bianco|rosso|white|red|vin|wine|vino|brut|extra brut|vieilles vignes|reserve|grande reserve|selection|millesime|vintage|grand cru|premier cru|1er cru)$/;
  const cands = lines.map((l,i)=>({l,i})).filter(({l,i}) => i!==domI && (!best || i!==best.i) && !BOIL.test(nl[i]) && !APPL.test(nl[i])
    && /[a-z]{3}/.test(nl[i]) && l.length<=45 && !/^\d/.test(nl[i]) && !EXCL.test(nl[i]) && !/cuv[ée]e/i.test(l));
  const strong = cands.filter(c=>/[a-z]{3}/.test(gl[c.i].replace(COUNTRY_WORDS," ")));
  const cuv = lines.findIndex(l=>/\bcuv[ée]e\b/i.test(l) && l.length<=60);
  let nom = "";
  if(cuv>=0){ nom = tidy(lines[cuv]); if(!out.domaine && strong[0]) out.domaine = tidy(strong[0].l); }
  else if(domI>=0 && /(chateau|clos|castello|schloss|quinta)/.test(nl[domI])) nom = out.domaine;
  else if(strong[0]){ nom = tidy(strong[0].l); if(!out.domaine && strong[0].i===0) out.domaine = nom; }
  else if(cands[0]) nom = tidy(cands[0].l);
  else if(out.domaine) nom = out.domaine;
  if(nom) out.nom = nom;

  // Pays (si pas déduit de l'appellation)
  if(!out.pays && swiss){ out.pays = "Suisse"; if(swiss!=="CH") out.region = swiss; }
  if(!out.pays){
    const t = nl.join(" ");
    for(const [re,p] of [[/(^|[^a-z])(france|francais)([^a-z]|$)/,"France"],[/(suisse|switzerland|schweiz|svizzera)/,"Suisse"],[/(italia|italy|italie)/,"Italie"],[/(espana|spain|espagne)/,"Espagne"],[/portugal/,"Portugal"],[/(deutschland|germany|allemagne)/,"Allemagne"],[/(osterreich|austria|autriche)/,"Autriche"]])
      if(re.test(t)){ out.pays = p; break; }
  }
  return out;
}

/* ---------- Form ---------- */
function openForm(id, copyFrom, opts={}){
  const editing = id ? db.wines.find(x=>x.id===id) : null;
  const w = editing ? {...editing} : copyFrom ? {...copyFrom, id:null, quantite:copyFrom.quantite, millesime:"", photo:copyFrom.photo} : {couleur:"rouge", quantite:1, contenance:"75 cl", note:0};
  const datalist = (name, field) => `<datalist id="dl-${name}">${[...new Set(db.wines.map(x=>x[field]).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`;
  const f = (k,l,cls="",type="text",extra="") => `<div class="fl ${cls}"><label for="f_${k}">${l}</label><input id="f_${k}" type="${type}" value="${esc(w[k]==null?"":w[k])}" ${extra}></div>`;
  $("#modal").innerHTML = `
    <div class="mh"><h2>${editing?"Modifier le vin":"Ajouter un vin"}</h2><button class="btn ghost" data-close>Annuler</button></div>
    <div class="mb"><div class="form">
      <div class="scan">
        <h4>📷 Pré-remplir depuis l'étiquette</h4>
        <div id="scanBody" ${(opts.scan || !editing) ? "" : "hidden"}>
          <div class="hint">Touchez la zone ci-dessous, puis <b>touchez-la une seconde fois</b> et choisissez <b>« Scanner du texte »</b> (icône <span style="white-space:nowrap">[≡]</span>). Visez l'étiquette, attendez que le texte soit surligné, puis touchez <b>« Insérer »</b>. Les champs se remplissent automatiquement.</div>
          <textarea id="scanTxt" placeholder="Le texte de l'étiquette apparaîtra ici…" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
          <div class="row">
            <button type="button" class="btn ghost" id="scanPaste">📋 Coller</button>
            <button type="button" class="btn ghost" id="scanRun">↻ Analyser à nouveau</button>
            <button type="button" class="btn ghost" id="scanClear">Effacer</button>
          </div>
          <div id="scanRes"></div>
          <details><summary>« Scanner du texte » n'apparaît pas ?</summary>
            <p>Prenez l'étiquette en photo avec l'appareil photo, ouvrez la photo dans l'app Photos, <b>maintenez le doigt sur le texte</b> de l'étiquette, choisissez « Tout sélectionner » puis « Copier ». Revenez ici et touchez « 📋 Coller ».<br>La fonction nécessite iPadOS 15 ou plus récent, sur un iPad de 2018 ou plus récent. Elle fonctionne sans internet.</p>
          </details>
        </div>
        ${(opts.scan || !editing) ? "" : `<button type="button" class="btn ghost" id="scanShow" style="margin-top:6px">Ouvrir le scanner</button>`}
      </div>
      <div class="sec">Le vin</div>
      ${f("nom","Nom / cuvée *","s6","text",'placeholder="Ex. Château Talbot" autocomplete="off"')}
      ${f("domaine","Domaine / producteur","","text",'list="dl-dom"')}
      ${f("appellation","Appellation","","text",'list="dl-app"')}
      ${f("region","Région","s2","text",'list="dl-reg"')}
      ${f("pays","Pays","s2","text",'list="dl-pays"')}
      <div class="fl s2"><label for="f_couleur">Couleur</label><select id="f_couleur">${COLORS.map(c=>`<option value="${c.k}" ${w.couleur===c.k?"selected":""}>${c.l}</option>`).join("")}</select></div>
      ${f("millesime","Millésime","s2","number",'inputmode="numeric" placeholder="'+(YEAR()-3)+'"')}
      ${f("contenance","Contenance","s2","text",'list="dl-cont"')}
      ${f("degre","Degré (% vol)","s2","text",'inputmode="decimal" placeholder="13,5"')}
      ${f("cepages","Cépages","s6","text",'list="dl-cep"')}
      <div class="sec">En cave</div>
      ${f("quantite","Quantité","s2","number",'min="0" inputmode="numeric"')}
      ${f("emplacement","Emplacement","s2","text",'list="dl-emp" placeholder="Ex. Casier B, rangée 3"')}
      ${f("prix","Prix d'achat / btl","s2","number",'step="0.01" inputmode="decimal"')}
      ${f("fournisseur","Fournisseur","","text",'list="dl-four"')}
      ${f("dateAchat","Date d'achat","","date")}
      <div class="sec">Garde & dégustation</div>
      ${f("boireDe","À boire à partir de","s2","number",'inputmode="numeric"')}
      ${f("boireA","À boire jusqu'à","s2","number",'inputmode="numeric"')}
      <div class="fl s2"><label>Note</label><div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<button type="button" data-s="${i}" class="${i<=(+w.note||0)?"on":""}">★</button>`).join("")}</div></div>
      <div class="fl s6"><label for="f_commentaire">Commentaire / notes de dégustation</label><textarea id="f_commentaire">${esc(w.commentaire||"")}</textarea></div>
      <div class="fl s6"><label>Photo de l'étiquette</label>
        <div class="photo"><div class="pv" id="pv" style="${w.photo?`background-image:url('${w.photo}')`:""}"></div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label class="btn ghost" style="text-align:center">📷 Prendre / choisir une photo<input type="file" accept="image/*" capture="environment" id="fPhoto" hidden></label>
            <button type="button" class="btn ghost" id="fPhotoDel" ${w.photo?"":"hidden"}>Retirer la photo</button>
          </div></div></div>
    </div>
    ${datalist("dom","domaine")}${datalist("app","appellation")}${datalist("reg","region")}${datalist("pays","pays")}${datalist("cep","cepages")}${datalist("emp","emplacement")}${datalist("four","fournisseur")}
    <datalist id="dl-cont"><option value="37.5 cl"><option value="50 cl"><option value="75 cl"><option value="150 cl (Magnum)"><option value="300 cl (Jéroboam)"></datalist>
    </div>
    <div class="mf"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="fSave">${editing?"Enregistrer":"Ajouter à la cave"}</button></div>`;
  openModal();
  let note = +w.note||0, photo = w.photo||"";
  document.querySelectorAll("#stars button").forEach(b=>b.onclick=()=>{ const s=+b.dataset.s; note = (note===s)?0:s; document.querySelectorAll("#stars button").forEach(x=>x.classList.toggle("on", +x.dataset.s<=note)); });
  $("#fPhoto").onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{ photo = await resizeImage(file, 700, .72); $("#pv").style.backgroundImage=`url('${photo}')`; $("#fPhotoDel").hidden=false; }
    catch(err){ toast("Impossible de lire cette image"); }
  };
  $("#fPhotoDel").onclick = ()=>{ photo=""; $("#pv").style.backgroundImage=""; $("#fPhotoDel").hidden=true; };

  // Pré-remplissage depuis le texte de l'étiquette.
  // Un champ rempli automatiquement peut être remplacé par une nouvelle analyse ; un champ saisi à la main n'est jamais écrasé.
  const auto = new Set(editing ? [] : ["couleur","contenance"]);
  document.querySelectorAll("#modal .fl input, #modal .fl select").forEach(el=>{
    const k = el.id.replace(/^f_/,"");
    const touched = ()=>{ auto.delete(k); el.classList.remove("auto"); };
    el.addEventListener("input", touched); el.addEventListener("change", touched);
  });
  const applyScan = ()=>{
    const txt = $("#scanTxt").value, res = analyzeLabel(txt); let n = 0;
    for(const [k,v] of Object.entries(res)){
      const el = $("#f_"+k); if(!el || !v) continue;
      const cur = (el.value||"").trim();
      if(cur && !auto.has(k) && cur!==v) continue;
      el.value = v; el.classList.add("auto"); auto.add(k); n++;
    }
    $("#scanRes").textContent = !txt.trim() ? "" : n
      ? `✨ ${n} champ${n>1?"s":""} pré-rempli${n>1?"s":""} (en jaune) — vérifiez-les avant d'enregistrer.`
      : "Aucune information reconnue. Essayez de rescanner l'étiquette, de plus près et bien éclairée.";
  };
  let scanT;
  const ta = $("#scanTxt"); let lastTxt = "";
  const onTxt = ()=>{ clearTimeout(scanT); scanT = setTimeout(()=>{ lastTxt = ta.value; applyScan(); }, 400); };
  ["input","change","keyup","paste"].forEach(ev=>ta.addEventListener(ev, onTxt));
  const poll = setInterval(()=>{ if(!document.body.contains(ta)) return clearInterval(poll); if(ta.value!==lastTxt && ta.value.trim()) onTxt(); }, 700);
  $("#scanRun").onclick = applyScan;
  $("#scanClear").onclick = ()=>{ $("#scanTxt").value=""; $("#scanRes").textContent=""; $("#scanTxt").focus(); };
  $("#scanPaste").onclick = async ()=>{
    try{
      const t = await navigator.clipboard.readText();
      if(!t){ toast("Le presse-papiers est vide"); return; }
      const ta = $("#scanTxt"); ta.value = (ta.value ? ta.value+"\n" : "") + t; applyScan();
    }catch(e){ $("#scanTxt").focus(); toast("Touchez la zone de texte, puis choisissez « Coller »"); }
  };
  $("#scanShow") && ($("#scanShow").onclick = ()=>{ $("#scanBody").hidden=false; $("#scanShow").remove(); $("#scanTxt").focus(); });
  if(opts.scan) setTimeout(()=>$("#scanTxt").focus(), 50);
  $("#fSave").onclick = ()=>{
    const g = k => ($("#f_"+k).value||"").trim();
    const nom = g("nom"); if(!nom){ $("#f_nom").focus(); toast("Le nom est obligatoire"); return; }
    const data = {nom, domaine:g("domaine"), appellation:g("appellation"), region:g("region"), pays:g("pays"), couleur:$("#f_couleur").value,
      millesime:g("millesime"), cepages:g("cepages"), contenance:g("contenance"), degre:g("degre"), quantite:Math.max(0,parseInt(g("quantite"))||0),
      emplacement:g("emplacement"), prix:g("prix"), fournisseur:g("fournisseur"), dateAchat:g("dateAchat"),
      boireDe:g("boireDe"), boireA:g("boireA"), note, commentaire:$("#f_commentaire").value.trim(), photo};
    if(editing){
      const diff = data.quantite - (+editing.quantite||0);
      Object.assign(editing, data);
      if(diff) db.log.unshift({id:uid(), wineId:editing.id, nom:data.nom, millesime:data.millesime, date:new Date().toISOString(), delta:diff, motif:"Correction d'inventaire", note:""});
      toast("Modifications enregistrées");
    } else {
      const nw = {id:uid(), ajoute:new Date().toISOString(), ...data};
      db.wines.push(nw);
      if(nw.quantite) db.log.unshift({id:uid(), wineId:nw.id, nom:nw.nom, millesime:nw.millesime, date:new Date().toISOString(), delta:nw.quantite, motif:"Entrée en cave", note:""});
      toast("Vin ajouté à la cave");
    }
    save(); closeModal(); renderHeader(); render();
  };
}

function resizeImage(file, max, quality){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onerror = rej;
    r.onload = ()=>{ const img = new Image(); img.onerror = rej; img.onload = ()=>{
      let {width:w, height:h} = img; const s = Math.min(1, max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      res(cv.toDataURL("image/jpeg", quality)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

/* ---------- Tableau de bord ---------- */
const STATUS_DEF = [
  {k:"boire", l:"Prêt à boire", c:"var(--ok)", i:"✓"},
  {k:"vite", l:"À boire cette année", c:"var(--warn)", i:"!"},
  {k:"passe", l:"Apogée dépassée", c:"var(--bad)", i:"⚠"},
  {k:"garder", l:"À garder", c:"var(--slate)", i:"⏳"},
  {k:"", l:"Garde non renseignée", c:"var(--none)", i:"–"}
];
const FACET_LABEL = {pays:"Pays", region:"Région", appellation:"Appellation", cepage:"Cépage", millesime:"Millésime", emplacement:"Emplacement"};
const fmtN = n => Math.round(n).toLocaleString("fr-CH");
const isVal = () => ui.dm==="val";
const metricOf = w => isVal() ? (+w.quantite||0)*(+w.prix||0) : (+w.quantite||0);
const qtyOf = list => list.reduce((s,w)=>s+(+w.quantite||0),0);
const NODATA = t => `<div class="nodata">${t||"Pas encore de données"}</div>`;
const CH = {};

function niceStep(raw){ if(raw<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

function groupBy(list, keyFn){
  const m = new Map();
  list.forEach(w=>{ [].concat(keyFn(w)).forEach(k=>{ k = (k||"").trim() || "Non renseigné"; m.set(k,(m.get(k)||0)+metricOf(w)); }); });
  return [...m.entries()].filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
}

function hbars(entries, facet, limit=8){
  if(!entries.length) return NODATA();
  const total = entries.reduce((s,e)=>s+e[1],0);
  const rows = entries.slice(0,limit), rest = entries.slice(limit);
  if(rest.length) rows.push(["Autres ("+rest.length+")", rest.reduce((s,e)=>s+e[1],0), true]);
  const mx = Math.max(...rows.map(r=>r[1]));
  return `<div class="hb">${rows.map(([k,v,other])=>{
    const tap = facet && !other && k!=="Non renseigné";
    return `<div class="hbr ${tap?"tap":""}" ${tap?`data-facet="${facet}" data-fv="${esc(k)}"`:""}>
      <span class="hbl">${esc(k)}</span>
      <span class="hbt"><span class="hbf" style="width:${Math.max(1.5, v/mx*100)}%${other?";background:var(--none)":""}"></span></span>
      <span class="hbv">${fmtN(v)}<small>${Math.round(v/total*100)} %</small></span></div>`;
  }).join("")}</div>`;
}

const colorParts = ws => COLORS.map(c=>({n:c.l, c:c.c, v:ws.filter(w=>colOf(w.couleur).k===c.k).reduce((s,w)=>s+metricOf(w),0)}));
function colorLegend(cols){
  const present = COLORS.filter((c,ci)=>cols.some(col=>col.parts[ci] && col.parts[ci].v>0));
  if(present.length<2) return "";
  return `<div class="clg">${present.map(c=>`<span><span class="dot" style="background:${c.c}"></span>${c.l}</span>`).join("")}</div>`;
}

function columns(id, cols, opts={}){
  const fmt = fmtN, count = opts.count || !isVal();
  cols.forEach(c=>c.fmt = fmt);
  CH[id] = cols;
  const totals = cols.map(c=>c.parts.reduce((s,p)=>s+p.v,0));
  const mx = Math.max(0, ...totals);
  if(!mx) return NODATA(opts.empty);
  let step = niceStep(mx/4); if(count) step = Math.max(1, step);
  const top = Math.ceil(mx/step)*step, ticks = [];
  for(let t=0; t<=top+1e-9; t+=step) ticks.push(t);
  const every = Math.ceil(cols.length/(opts.maxLabels||14));
  return `<div class="cc">
    <div class="ccy">${ticks.map(t=>`<span style="bottom:${t/top*100}%">${fmt(t)}</span>`).join("")}</div>
    <div class="ccp">${ticks.map(t=>`<i style="bottom:${t/top*100}%"></i>`).join("")}
      <div class="ccc">${cols.map((c,i)=>`<div class="col" data-ch="${id}" data-ci="${i}" aria-label="${esc(c.title||c.label)} : ${fmt(totals[i])}">
        <div class="stk" style="height:${totals[i]/top*100}%">${c.parts.filter(p=>p.v>0).map(p=>`<span style="flex:${p.v};background:${p.c}"></span>`).join("")}</div></div>`).join("")}</div>
    </div>
    <div></div>
    <div class="ccx">${cols.map((c,i)=>`<span>${i%every===0 || i===cols.length-1 && cols.length<=every*2 ? esc(c.label) : ""}</span>`).join("")}</div>
  </div>`;
}

function donut(list){
  const ents = COLORS.map(c=>({k:c.k, l:c.l, c:c.c, v:list.filter(w=>colOf(w.couleur).k===c.k).reduce((s,w)=>s+metricOf(w),0)})).filter(e=>e.v>0);
  const total = ents.reduce((s,e)=>s+e.v,0);
  if(!total) return NODATA();
  const R = 54, C = 2*Math.PI*R, gap = ents.length>1 ? 2.5 : 0; let off = 0;
  const segs = ents.map(e=>{ const len = e.v/total*C;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${e.c}" stroke-width="20" stroke-dasharray="${Math.max(.5,len-gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    off += len; return s; }).join("");
  return `<div class="donut">
    <svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Répartition par couleur">${segs}
      <text x="70" y="70" text-anchor="middle" class="dv">${fmtN(total)}</text>
      <text x="70" y="88" text-anchor="middle" class="dl">${isVal()?"valeur":"bouteilles"}</text></svg>
    <div class="lg">${ents.map(e=>`<div class="lgr tap" data-color="${e.k}"><span class="dot" style="background:${e.c}"></span><span class="lgl">${e.l}</span><span class="lgv">${fmtN(e.v)}<small>${Math.round(e.v/total*100)} %</small></span></div>`).join("")}</div>
  </div>`;
}

function maturity(list){
  const m = {}; list.forEach(w=>{ const k = status(w).k; m[k] = (m[k]||0)+metricOf(w); });
  const total = Object.values(m).reduce((a,b)=>a+b,0);
  if(!total) return NODATA();
  const ss = STATUS_DEF.filter(s=>m[s.k]>0);
  return `<div class="mat">${ss.map(s=>`<span style="flex:${m[s.k]};background:${s.c}"></span>`).join("")}</div>
  <div class="lg">${ss.map(s=>`<div class="lgr ${s.k?"tap":""}" ${s.k?`data-status="${s.k}"`:""}><span class="ico" style="background:${s.c}">${s.i}</span><span class="lgl">${s.l}</span><span class="lgv">${fmtN(m[s.k])}<small>${Math.round(m[s.k]/total*100)} %</small></span></div>`).join("")}</div>`;
}

function winesTable(list){
  const tab = ui.dwTab || "btl";
  let rows = list.slice();
  if(tab==="val") rows = rows.filter(w=>+w.prix>0).sort((a,b)=>(b.quantite*b.prix)-(a.quantite*a.prix));
  else if(tab==="note") rows = rows.filter(w=>+w.note>0).sort((a,b)=>(+b.note)-(+a.note) || (+b.quantite)-(+a.quantite));
  else if(tab==="urg") rows = rows.filter(w=>+w.boireA).sort((a,b)=>(+a.boireA)-(+b.boireA) || (+b.quantite)-(+a.quantite));
  else rows.sort((a,b)=>(+b.quantite)-(+a.quantite) || (a.nom||"").localeCompare(b.nom||"","fr"));
  rows = rows.slice(0,10);
  const tabs = [["btl","Plus de bouteilles"],["val","Plus grande valeur"],["note","Mieux notés"],["urg","À boire en premier"]];
  return `<div class="seg" style="margin-bottom:12px;flex-wrap:wrap">${tabs.map(([k,l])=>`<button data-wt="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div>
  ${!rows.length ? NODATA(tab==="val"?"Renseignez les prix d'achat pour voir ce classement":tab==="note"?"Notez vos vins pour voir ce classement":tab==="urg"?"Renseignez les dates de garde pour voir ce classement":"") :
  `<table class="wt"><tr><th>Vin</th><th class="hn">Appellation</th><th class="r">Btl</th><th class="r">Valeur</th><th class="hn">Garde</th></tr>
  ${rows.map(w=>{ const st = status(w); return `<tr data-open="${w.id}" class="tap">
    <td><span class="dot" style="background:${colOf(w.couleur).c};margin-right:8px"></span>${esc(w.nom)} <span style="color:var(--muted)">${esc(w.millesime||"")}</span>${tab==="note"?` <span style="color:#d3a12c">${"★".repeat(+w.note)}</span>`:""}</td>
    <td class="hn">${esc(w.appellation||"")}</td><td class="r">${+w.quantite}</td><td class="r">${+w.prix?fmtN(w.quantite*w.prix):"—"}</td>
    <td class="hn">${w.boireA||w.boireDe?`${esc(w.boireDe||"…")}–${esc(w.boireA||"…")}`:""}${st.l&&st.k!=="boire"?` <span class="badge ${st.cls}">${st.k==="garder"?"À garder":st.l}</span>`:""}</td></tr>`; }).join("")}</table>`}`;
}

function renderStats(){
  const Y = YEAR();
  const all = db.wines.filter(w=>+w.quantite>0);
  const list = all.filter(w=>!ui.dc || colOf(w.couleur).k===ui.dc);
  if(!all.length){ $("#main").innerHTML = `<div class="empty"><div class="big">Le tableau de bord est vide</div>Ajoutez des vins à votre cave pour voir apparaître les graphiques.</div>`; return; }

  // Indicateurs
  const btl = qtyOf(list), refs = list.length;
  const val = list.reduce((s,w)=>s+(+w.quantite||0)*(+w.prix||0),0);
  const priced = list.filter(w=>+w.prix>0), pricedBtl = qtyOf(priced), noPrice = refs - priced.length;
  const nPays = new Set(list.map(w=>w.pays).filter(Boolean)).size, nReg = new Set(list.map(w=>w.region).filter(Boolean)).size, nApp = new Set(list.map(w=>w.appellation).filter(Boolean)).size;
  const vint = list.filter(w=>/^\d{4}$/.test(String(w.millesime))), vb = qtyOf(vint);
  const avgAge = vb ? vint.reduce((s,w)=>s+(+w.quantite)*(Y - +w.millesime),0)/vb : null;
  const ready = qtyOf(list.filter(w=>["boire","vite","passe"].includes(status(w).k)));
  const urgent = qtyOf(list.filter(w=>["vite","passe"].includes(status(w).k)));
  const wineColor = id => { const w = db.wines.find(x=>x.id===id); return w ? colOf(w.couleur).k : "autre"; };
  const outs = db.log.filter(l=>l.delta<0 && (!ui.dc || wineColor(l.wineId)===ui.dc));
  const out12 = outs.filter(l=>(Date.now()-new Date(l.date))<365*864e5).reduce((s,l)=>s-l.delta,0);

  // Millésimes
  const ys = list.filter(w=>/^\d{4}$/.test(String(w.millesime))), nv = list.filter(w=>!/^\d{4}$/.test(String(w.millesime)));
  let years = [...new Set(ys.map(w=>+w.millesime))].sort((a,b)=>a-b);
  if(years.length && years[years.length-1]-years[0] <= 40){ const a = years[0], b = years[years.length-1]; years = []; for(let y=a; y<=b; y++) years.push(y); }
  const wineLine = w => `${w.nom}${w.millesime?" "+w.millesime:""} · ${+w.quantite} btl`;
  const colsMill = years.map(y=>{ const ws = ys.filter(w=>+w.millesime===y).sort((a,b)=>b.quantite-a.quantite);
    return {label:String(y), title:"Millésime "+y, parts:colorParts(ws), wines:ws.map(wineLine), facet: ws.length?{k:"millesime", v:String(y), label:"Millésime : "+y}:null}; });

  // Calendrier de garde
  const withEnd = list.filter(w=>+w.boireA), noEnd = qtyOf(list.filter(w=>!+w.boireA));
  const buckets = [{label:"Passé", title:"Apogée déjà dépassée", test:w=>+w.boireA<Y}];
  for(let y=Y; y<=Y+10; y++) buckets.push({label:String(y), title:"À boire au plus tard en "+y, test:w=>+w.boireA===y});
  buckets.push({label:"Après", title:"À boire après "+(Y+10), test:w=>+w.boireA>Y+10});
  const colsGarde = buckets.map(b=>{ const ws = withEnd.filter(b.test).sort((a,c)=>c.quantite-a.quantite); return {label:b.label, title:b.title, parts:colorParts(ws), wines:ws.map(wineLine)}; });

  // Consommation (12 derniers mois, toujours en bouteilles)
  const now = new Date(), colsOut = [];
  for(let i=11; i>=0; i--){
    const d0 = new Date(now.getFullYear(), now.getMonth()-i, 1), d1 = new Date(now.getFullYear(), now.getMonth()-i+1, 1);
    const ls = outs.filter(l=>{ const t = new Date(l.date); return t>=d0 && t<d1; });
    const names = {}; ls.forEach(l=>{ const k = `${l.nom}${l.millesime?" "+l.millesime:""}`; names[k]=(names[k]||0)-l.delta; });
    colsOut.push({label:d0.toLocaleDateString("fr-CH",{month:"short"}).replace(".",""), title:d0.toLocaleDateString("fr-CH",{month:"long",year:"numeric"}),
      parts:COLORS.map(c=>({n:c.l, c:c.c, v:ls.filter(l=>wineColor(l.wineId)===c.k).reduce((s,l)=>s-l.delta,0)})),
      wines:Object.entries(names).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} · ${v} btl`)});
  }
  const saveDm = ui.dm; // la consommation se compte toujours en bouteilles
  const unit = isVal() ? "valeur d'achat" : "bouteilles";

  ui.dm = "btl"; const consHTML = columns("out", colsOut, {count:true, empty:"Aucune bouteille sortie ces 12 derniers mois"}); ui.dm = saveDm;

  $("#main").innerHTML = `${backupBanner()}
  <div class="dfil">
    <div class="seg" role="group" aria-label="Mesure"><button data-dm="btl" class="${isVal()?"":"on"}">Bouteilles</button><button data-dm="val" class="${isVal()?"on":""}">Valeur d'achat</button></div>
    <select class="f" id="dColor"><option value="">Toutes les couleurs</option>${COLORS.map(c=>`<option value="${c.k}" ${ui.dc===c.k?"selected":""}>${c.l}</option>`).join("")}</select>
    <span class="dnote">${isVal()?`Valeur = bouteilles × prix d'achat.${noPrice?` ${noPrice} référence${noPrice>1?"s":""} sans prix non comptée${noPrice>1?"s":""}.`:""}`:"Touchez un élément pour voir les vins correspondants."}</span>
  </div>
  ${!list.length ? NODATA("Aucun vin de cette couleur en cave") : `
  <div class="kpis">
    <div class="kpi"><div class="v">${fmtN(btl)}</div><div class="l">bouteilles en cave</div><small>${refs} référence${refs>1?"s":""}</small></div>
    <div class="kpi"><div class="v">${money(val)}</div><div class="l">valeur d'achat</div><small>${pricedBtl?`≈ ${money(val/pricedBtl)} par bouteille`:"prix non renseignés"}</small></div>
    <div class="kpi"><div class="v">${nPays} pays</div><div class="l">origines</div><small>${nReg} région${nReg>1?"s":""} · ${nApp} appellation${nApp>1?"s":""}</small></div>
    <div class="kpi"><div class="v">${avgAge===null?"—":avgAge.toFixed(1).replace(".",",")+" ans"}</div><div class="l">âge moyen des bouteilles</div><small>${years.length?`millésimes ${years[0]} à ${years[years.length-1]}`:"millésimes non renseignés"}</small></div>
    <div class="kpi tap" data-status="boire"><div class="v">${fmtN(ready)}</div><div class="l">bouteilles prêtes à boire</div><small>${urgent?`dont ${urgent} à boire vite`:"aucune urgence"}</small></div>
    <div class="kpi"><div class="v">${fmtN(out12)}</div><div class="l">bouteilles sorties</div><small>sur les 12 derniers mois</small></div>
  </div>
  <div class="dash">
    <div class="panel"><h3>Couleurs</h3><div class="sub">En ${unit}</div>${donut(list)}</div>
    <div class="panel"><h3>Maturité</h3><div class="sub">Selon les dates de garde renseignées, en ${unit}</div>${maturity(list)}</div>
    <div class="panel full"><h3>Millésimes</h3><div class="sub">En ${unit} par millésime${nv.length?` · ${fmtN(nv.reduce((s,w)=>s+metricOf(w),0))} sans millésime`:""} · touchez une colonne pour le détail</div>${colorLegend(colsMill)}${columns("mill", colsMill, {empty:"Aucun millésime renseigné"})}</div>
    <div class="panel"><h3>Pays</h3><div class="sub">En ${unit}</div>${hbars(groupBy(list,w=>w.pays),"pays",8)}</div>
    <div class="panel"><h3>Régions</h3><div class="sub">En ${unit}</div>${hbars(groupBy(list,w=>w.region),"region",8)}</div>
    <div class="panel"><h3>Appellations</h3><div class="sub">En ${unit}</div>${hbars(groupBy(list,w=>w.appellation),"appellation",10)}</div>
    <div class="panel"><h3>Cépages</h3><div class="sub">En ${unit} · un assemblage compte pour chacun de ses cépages</div>${hbars(groupBy(list,w=>(w.cepages||"").split(",").map(s=>s.trim()).filter(Boolean)),"cepage",10)}</div>
    <div class="panel full"><h3>Calendrier de garde</h3><div class="sub">En ${unit}, selon l'année limite pour les boire${noEnd?` · ${fmtN(noEnd)} bouteille${noEnd>1?"s":""} sans date de garde`:""}</div>${colorLegend(colsGarde)}${columns("garde", colsGarde, {empty:"Renseignez « À boire jusqu'à » sur vos vins pour voir ce calendrier"})}</div>
    <div class="panel full"><h3>Vins</h3>${winesTable(list)}</div>
    <div class="panel"><h3>Emplacements</h3><div class="sub">En ${unit}</div>${hbars(groupBy(list,w=>w.emplacement),"emplacement",10)}</div>
    <div class="panel"><h3>Consommation</h3><div class="sub">Bouteilles sorties par mois, sur 12 mois</div>${colorLegend(colsOut)}${consHTML}</div>
  </div>`}`;

  // Interactions
  document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{ ui.dm=b.dataset.dm; renderStats(); });
  $("#dColor").onchange = e=>{ ui.dc = e.target.value; renderStats(); };
  document.querySelectorAll("[data-facet]").forEach(r=>r.onclick=()=>{ const k=r.dataset.facet, v=r.dataset.fv; goCave({facet:{k, v, label:FACET_LABEL[k]+" : "+v}}); });
  document.querySelectorAll("[data-color]").forEach(r=>r.onclick=()=>goCave({colors:new Set([r.dataset.color])}));
  document.querySelectorAll("[data-status]").forEach(r=>r.onclick=()=>goCave({status:r.dataset.status}));
  document.querySelectorAll("[data-wt]").forEach(b=>b.onclick=()=>{ ui.dwTab=b.dataset.wt; renderStats(); });
  document.querySelectorAll("[data-open]").forEach(r=>r.onclick=()=>openDetail(r.dataset.open));
  document.querySelectorAll(".col").forEach(c=>{
    const col = CH[c.dataset.ch][+c.dataset.ci];
    c.onclick = e=>{ e.stopPropagation(); if(!col.parts.some(p=>p.v>0)) return hideTip(); showTip(e, col, c); };
    c.onpointerenter = e=>{ if(e.pointerType==="mouse" && col.parts.some(p=>p.v>0)) showTip(e, col, c); };
  });
}

function showTip(e, col, el){
  document.querySelectorAll(".col.sel").forEach(x=>x.classList.remove("sel")); el && el.classList.add("sel");
  const t = $("#tip"), ps = col.parts.filter(p=>p.v>0), tot = ps.reduce((s,p)=>s+p.v,0);
  t.innerHTML = `<div class="tt">${esc(col.title||col.label)}</div>
    ${ps.map(p=>`<div class="tr"><span class="dot" style="background:${p.c}"></span>${esc(p.n)}<b>${col.fmt(p.v)}</b></div>`).join("")}
    ${ps.length>1?`<div class="tr tot">Total<b>${col.fmt(tot)}</b></div>`:""}
    ${col.wines&&col.wines.length?`<div class="tw">${col.wines.slice(0,6).map(esc).join("<br>")}${col.wines.length>6?`<br>+ ${col.wines.length-6} autre${col.wines.length-6>1?"s":""}`:""}</div>`:""}
    ${col.facet?`<button class="btn" id="tipGo">Voir ces vins →</button>`:""}`;
  t.style.display = "block"; tipAt = Date.now(); tipY = scrollY;
  const r = t.getBoundingClientRect(); let x = e.clientX+14, y = e.clientY-r.height-14;
  if(x+r.width > innerWidth-8) x = e.clientX-r.width-14; if(x<8) x = 8;
  if(y<8) y = Math.min(e.clientY+18, innerHeight-r.height-8);
  t.style.left = x+"px"; t.style.top = y+"px";
  const go = $("#tipGo"); if(go) go.onclick = ev=>{ ev.stopPropagation(); hideTip(); goCave({facet:col.facet}); };
}
function hideTip(){ const t = $("#tip"); if(t) t.style.display = "none"; document.querySelectorAll(".col.sel").forEach(x=>x.classList.remove("sel")); }
document.addEventListener("click", e=>{ if(!e.target.closest("#tip") && !e.target.closest(".col")) hideTip(); });
let tipAt = 0, tipY = 0;
window.addEventListener("scroll", ()=>{ if(Date.now()-tipAt>400 && Math.abs(scrollY-tipY)>30) hideTip(); }, {passive:true});

function goCave(patch){
  Object.assign(ui, {q:"", region:"", status:"", facet:null, colors:new Set(ui.dc?[ui.dc]:[]), showEmpty:false}, patch);
  setView("cave");
}

/* ---------- Sauvegarde (kDrive / Fichiers) ---------- */
const BK = KEY+"-backup", PREFS = KEY+"-prefs", SNOOZE = KEY+"-snooze";
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let backup = lsGet(BK, {at:null, changes:0, since:null});
let prefs = Object.assign({days:7, changes:10}, lsGet(PREFS, {}));

function noteChange(){
  if(!backup.changes) backup.since = new Date().toISOString();
  backup.changes = (backup.changes||0) + 1; lsSet(BK, backup);
}
function markBackedUp(){ backup = {at:new Date().toISOString(), changes:0, since:null}; lsSet(BK, backup); lsSet(SNOOZE, 0); }
function ago(iso){
  if(!iso) return "jamais";
  const d0 = new Date(iso), d = new Date(); d0.setHours(0,0,0,0); d.setHours(0,0,0,0);
  const n = Math.round((d-d0)/864e5);
  return n<=0 ? "aujourd'hui" : n===1 ? "hier" : `il y a ${n} jours`;
}
function backupDue(){
  if(!db.wines.length || !backup.changes) return false;
  if(Date.now() < (lsGet(SNOOZE,0)||0)) return false;
  const ref = backup.at || backup.since, days = ref ? (Date.now()-new Date(ref))/864e5 : 0;
  return (prefs.days>0 && days>=prefs.days) || (prefs.changes>0 && backup.changes>=prefs.changes);
}
function backupBanner(){
  if(!backupDue()) return "";
  const n = backup.changes;
  return `<div class="install bk"><span class="bkico" aria-hidden="true">☁︎</span>
    <div><b>Pensez à sauvegarder votre cave</b><br>Dernière sauvegarde : ${ago(backup.at)} · ${n} modification${n>1?"s":""} depuis.</div>
    <span class="x" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-bk="save">Sauvegarder</button><button class="btn ghost" data-bk="later">Plus tard</button></span></div>`;
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-bk]"); if(!b) return;
  if(b.dataset.bk==="save") backupNow();
  else { lsSet(SNOOZE, Date.now()+864e5); render(); toast("Rappel reporté à demain"); }
});

// Partage d'un fichier : sur iPad, ouvre le menu Partager (kDrive, Enregistrer dans Fichiers, AirDrop…).
// Renvoie false si l'utilisateur a annulé.
async function download(name, text, type){
  const blob = new Blob([text], {type});
  try{
    const file = new File([blob], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  }catch(e){ if(e && (e.name==="AbortError" || e.name==="NotAllowedError")) return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1500);
  return true;
}
const stamp = () => new Date().toISOString().slice(0,10);
async function backupNow(){
  const ok = await download(`ma-cave-sauvegarde-${stamp()}.json`, JSON.stringify({app:"ma-cave", version:1, exportedAt:new Date().toISOString(), ...db}, null, 1), "application/json");
  if(!ok){ toast("Sauvegarde annulée"); return; }
  markBackedUp(); renderHeader(); render(); toast("✓ Sauvegarde envoyée");
}

// Import : sur iPad, la fenêtre « Parcourir » donne accès à kDrive via l'app Fichiers.
function pickBackup(){
  let inp = $("#impFile");
  if(!inp){ inp = document.createElement("input"); inp.type = "file"; inp.id = "impFile"; inp.accept = ".json,application/json"; inp.hidden = true; document.body.appendChild(inp); }
  inp.value = ""; inp.onchange = e=>{ const f = e.target.files[0]; if(f) importFile(f); };
  inp.click();
}
function importFile(file){
  const r = new FileReader();
  r.onerror = ()=>toast("Impossible de lire ce fichier");
  r.onload = ()=>{
    let d;
    try{ d = JSON.parse(r.result); if(!Array.isArray(d.wines)) throw 0; }
    catch(err){ toast("Fichier invalide : ce n'est pas une sauvegarde de Ma Cave"); return; }
    const nb = d.wines.reduce((s,w)=>s+(+w.quantite||0),0);
    const when = d.exportedAt || d.savedAt;
    const apply = mode=>{
      if(mode==="replace"){ db.wines = d.wines; db.log = d.log||[]; }
      else {
        const ids = new Set(db.wines.map(w=>w.id)); d.wines.forEach(w=>{ if(!ids.has(w.id)) db.wines.push(w); });
        const lids = new Set(db.log.map(l=>l.id)); (d.log||[]).forEach(l=>{ if(!lids.has(l.id)) db.log.push(l); });
        db.log.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      }
      save();
      if(mode==="replace") markBackedUp(); // la cave est identique au fichier de sauvegarde
      closeModal(); renderHeader(); render(); toast(mode==="replace" ? "✓ Cave restaurée" : "✓ Vins ajoutés à la cave");
    };
    $("#modal").innerHTML = `
      <div class="mh"><h2>Importer la sauvegarde</h2><button class="btn ghost" data-close>Annuler</button></div>
      <div class="mb">
        <p style="margin-top:0"><b>${esc(file.name)}</b><br>${d.wines.length} référence${d.wines.length>1?"s":""} · ${nb} bouteille${nb>1?"s":""}${when?` · sauvegardée le ${new Date(when).toLocaleString("fr-CH",{dateStyle:"short",timeStyle:"short"})}`:""}</p>
        ${db.wines.length ? `<p style="color:var(--muted);font-size:14px">Votre cave actuelle contient ${db.wines.length} référence${db.wines.length>1?"s":""}.<br><b>Remplacer</b> : la cave devient exactement celle du fichier (à utiliser pour restaurer ou changer d'iPad).<br><b>Fusionner</b> : ajoute seulement les vins du fichier qui ne sont pas déjà dans la cave.</p>` : ""}
      </div>
      <div class="mf"><button class="btn ghost" data-close>Annuler</button>
        ${db.wines.length ? `<button class="btn ghost" id="impMerge">Fusionner</button><button class="btn danger" id="impRep">Remplacer ma cave</button>` : `<button class="btn" id="impRep">Importer</button>`}</div>`;
    openModal();
    $("#impRep").onclick = ()=>apply("replace");
    $("#impMerge") && ($("#impMerge").onclick = ()=>apply("merge"));
  };
  r.readAsText(file);
}

function renderSave(){
  const due = backupDue(), n = backup.changes||0;
  const stateTxt = !db.wines.length ? "Votre cave est vide." :
    !n ? `<span class="ok">✓ Tout est sauvegardé</span> (dernière sauvegarde : ${ago(backup.at)}).` :
    `${due?`<span class="due">⚠ Sauvegarde conseillée</span>`:"Modifications en attente"} : ${n} modification${n>1?"s":""} depuis la dernière sauvegarde (${ago(backup.at)}).`;
  const opt = (v, cur, l) => `<option value="${v}" ${+cur===v?"selected":""}>${l}</option>`;
  $("#main").innerHTML = `
  <div class="panel"><h3>☁︎ Sauvegarde</h3>
    <p style="margin-top:0">${stateTxt}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="bSave" ${db.wines.length?"":"disabled style='opacity:.5'"}>⬆︎ Sauvegarder</button>
      <button class="btn ghost" id="bImport">⬇︎ Importer une sauvegarde</button>
    </div>
    <details style="margin-top:14px;font-size:14px;color:var(--muted)"><summary style="cursor:pointer;font-weight:600;color:var(--text)">Comment ça marche ?</summary>
      <p><b>Sauvegarder</b> : le menu Partager de l'iPad s'ouvre. Choisissez la destination :</p>
      <ul style="margin:0 0 10px;padding-left:20px;line-height:1.6">
        <li><b>kDrive</b> : touchez l'icône kDrive (faites défiler la rangée d'apps si besoin), puis un dossier, par exemple « Ma Cave ».</li>
        <li><b>Sur l'iPad</b> : « Enregistrer dans Fichiers », puis « Sur mon iPad ».</li>
        <li><b>iCloud Drive</b> : « Enregistrer dans Fichiers », puis iCloud Drive.</li>
        <li><b>E-mail</b> : touchez Mail, le fichier est joint automatiquement.</li>
        <li><b>AirDrop</b>, Messages… : vers un autre appareil.</li>
      </ul>
      <p><b>Importer</b> : dans la fenêtre qui s'ouvre, touchez <b>Parcourir</b>, puis l'emplacement (kDrive, Sur mon iPad, iCloud Drive…) et choisissez le fichier de sauvegarde le plus récent. Pour une sauvegarde reçue par e-mail : ouvrez la pièce jointe dans Mail, enregistrez-la dans Fichiers, puis importez-la.</p>
      <p><b>kDrive n'apparaît pas ?</b> Installez l'app kDrive d'Infomaniak depuis l'App Store et connectez-vous. Ensuite, dans l'app Fichiers, onglet Parcourir, touchez <b>⋯</b> puis <b>Modifier</b>, et activez kDrive.</p>
      <p>Chaque sauvegarde est un fichier daté (ma-cave-sauvegarde-AAAA-MM-JJ.json). Vous pouvez supprimer les anciennes quand vous voulez.</p>
    </details>
  </div>
  <div class="panel"><h3>Rappel de sauvegarde</h3>
    <p style="margin-top:0;color:var(--muted);font-size:14px">Un bandeau vous le rappelle en haut de la cave quand l'une des deux conditions est atteinte.</p>
    <div class="form" style="grid-template-columns:1fr 1fr">
      <div class="fl" style="grid-column:span 1"><label for="pDays">Me le rappeler</label><select id="pDays">${opt(3,prefs.days,"tous les 3 jours")}${opt(7,prefs.days,"chaque semaine")}${opt(14,prefs.days,"toutes les 2 semaines")}${opt(30,prefs.days,"chaque mois")}${opt(0,prefs.days,"jamais selon la durée")}</select></div>
      <div class="fl" style="grid-column:span 1"><label for="pChg">ou après</label><select id="pChg">${opt(5,prefs.changes,"5 modifications")}${opt(10,prefs.changes,"10 modifications")}${opt(25,prefs.changes,"25 modifications")}${opt(50,prefs.changes,"50 modifications")}${opt(0,prefs.changes,"jamais selon le nombre")}</select></div>
    </div>
  </div>
  <div class="panel"><h3>Exporter l'inventaire</h3>
    <p style="margin-top:0;color:var(--muted);font-size:14px">Un tableau lisible dans Excel ou Numbers. Il sert à consulter ou imprimer la cave, pas à la restaurer.</p>
    <button class="btn ghost" id="bCsv">⬇︎ Exporter l'inventaire (.csv)</button>
  </div>
  <div class="panel"><h3>Zone sensible</h3>
    <button class="btn danger" id="bReset">Vider entièrement la cave</button>
  </div>
  <p style="color:var(--muted);font-size:12px;text-align:center">Ma Cave · version ${APP_VERSION} · ${isStandalone()?"application installée":"ouverte dans le navigateur"}${navigator.serviceWorker&&navigator.serviceWorker.controller?" · disponible hors ligne":""}</p>`;
  $("#bSave").onclick = backupNow;
  $("#bImport").onclick = pickBackup;
  $("#pDays").onchange = e=>{ prefs.days = +e.target.value; lsSet(PREFS, prefs); renderSave(); renderHeader(); };
  $("#pChg").onchange = e=>{ prefs.changes = +e.target.value; lsSet(PREFS, prefs); renderSave(); renderHeader(); };
  $("#bCsv").onclick = ()=>{
    const cols = [["nom","Nom"],["domaine","Domaine"],["appellation","Appellation"],["region","Région"],["pays","Pays"],["couleur","Couleur"],["millesime","Millésime"],["cepages","Cépages"],["contenance","Contenance"],["degre","Degré"],["quantite","Quantité"],["emplacement","Emplacement"],["prix","Prix"],["fournisseur","Fournisseur"],["dateAchat","Date d'achat"],["boireDe","Boire dès"],["boireA","Boire jusqu'à"],["note","Note"],["commentaire","Commentaire"]];
    const cell = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const csv = "﻿"+[cols.map(c=>cell(c[1])).join(";"), ...db.wines.map(w=>cols.map(c=>cell(c[0]==="couleur"?colOf(w.couleur).l:w[c[0]])).join(";"))].join("\r\n");
    download(`ma-cave-inventaire-${stamp()}.csv`, csv, "text/csv;charset=utf-8");
  };
  $("#bReset").onclick = ()=>{
    if(!confirm("Vider toute la cave et le journal ? Pensez à faire une sauvegarde avant.")) return;
    if(!confirm("Confirmez-vous la suppression définitive de toutes les données ?")) return;
    db = {wines:[], log:[], savedAt:null}; save(); backup = {at:backup.at, changes:0, since:null}; lsSet(BK, backup); renderHeader(); renderSave(); toast("Cave vidée");
  };
}

/* ---------- Modal & routing ---------- */
function openModal(){ $("#ov").classList.add("show"); $("#ov").scrollTop=0; document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); }
function closeModal(){ $("#ov").classList.remove("show"); }
$("#ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

function render(){
  ({cave:renderCave, journal:renderJournal, stats:renderStats, save:renderSave})[ui.view]();
}
function setView(v){
  hideTip(); ui.view = v;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on", x.dataset.v===v));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
$("#addBtn").onclick = ()=>openForm();
$("#scanBtn").onclick = ()=>openForm(null, null, {scan:true});

load(); renderHeader(); render(); window.__caveOK = true;
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
</script>
