<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellier à confitures</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Confitures">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Encode+Sans+Semi+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout : une étagère. En-tête-étiquette, onglets Cellier / Carnet, lots en étiquettes de pots, recettes rangées par millésime. */
:root {
  --bg: #f7f3f5;
  --paper: #fffcfd;
  --ink: #2a1a24;
  --muted: #76626d;
  --line: #e4d8de;
  --accent: #7a1f4a;      /* cassis */
  --accent-ink: #ffffff;
  --accent-soft: #f3e2ea;
  --apricot: #d9822b;
  --apricot-soft: #fbead6;
  --ok: #3f7a4a;
  --warn: #b5651d;
  --danger: #a3262f;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1418; --paper: #251c21; --ink: #f2e8ed; --muted: #b29fa9; --line: #3d2f36;
    --accent: #e07aa6; --accent-ink: #1b1418; --accent-soft: #3a2230;
    --apricot: #f0a65c; --apricot-soft: #3b2a1b;
    --ok: #7fc28a; --warn: #f0a65c; --danger: #f07a82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1418; --paper: #251c21; --ink: #f2e8ed; --muted: #b29fa9; --line: #3d2f36;
  --accent: #e07aa6; --accent-ink: #1b1418; --accent-soft: #3a2230;
  --apricot: #f0a65c; --apricot-soft: #3b2a1b;
  --ok: #7fc28a; --warn: #f0a65c; --danger: #f07a82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: grid; gap: 24px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* En-tête */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.head h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.05; }
.head .kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 20px 28px; }
.stat { display: grid; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

/* Barre d'outils */
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.tabs { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; min-width: 0; width: 210px; max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--paper); border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Cellier : étiquettes de pots */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.label {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0;
  position: relative;
}
.label.empty-lot { opacity: .62; }
.label .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.label h3 { font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.vintage {
  font-family: var(--f-mono); font-size: 13px; letter-spacing: .06em;
  border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 1px 7px; white-space: nowrap;
}
.meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.meta .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.jars { display: flex; flex-wrap: wrap; gap: 4px; }
.jar { width: 14px; height: 18px; border-radius: 3px 3px 5px 5px; border: 1.5px solid var(--accent); position: relative; }
.jar::before { content: ""; position: absolute; left: 1px; right: 1px; top: -4px; height: 3px; border-radius: 1px; background: var(--muted); }
.jar.full { background: var(--accent); }
.jar.petit { width: 11px; height: 13px; }
.jar.grand { width: 18px; height: 24px; }
.jars { align-items: end; }
.size-tag { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--apricot-soft); border-radius: 4px; padding: 1px 7px; }
.sizes { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.sizes b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.sizes .chip { font-family: var(--f-body); }
.sizerows { display: grid; gap: 6px; }
.srow { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) auto auto; align-items: center; gap: 8px; }
.srow .size-tag { text-align: center; }
.srow .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.srow .n b { font-size: 17px; font-weight: 500; }
.srow .stepper button { width: 32px; height: 32px; }
.potgrid { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.potgrid.edit { grid-template-columns: 6em minmax(0, 1fr) minmax(0, 1fr); }
.potgrid label { font-size: 14px; font-weight: 500; }
.potgrid input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); width: 100%; min-width: 0; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 6.5em; gap: 6px; }
#f_prov { text-transform: uppercase; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.flabel { font-size: 13px; font-weight: 500; color: var(--muted); }
.preview-wrap { display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 18px 12px; }
#e_prev { box-shadow: 0 1px 5px rgba(0, 0, 0, .2); border-radius: 3px; max-width: 100%; }
#e_prev.round { border-radius: 50%; }
dialog.big { width: min(940px, calc(100vw - 32px)); }
.contents { display: contents; }
.stage-wrap { display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px 8px; overflow: hidden; }
.stage { position: relative; box-shadow: 0 1px 5px rgba(0, 0, 0, .2); max-width: 100%; border-radius: 3px; overflow: hidden; }
.stage.round { border-radius: 50%; }
.stage canvas { display: block; width: 100%; height: 100%; }
#t_boxes { position: absolute; inset: 0; touch-action: none; }
.fbox { position: absolute; border: 1px dashed rgba(122, 31, 74, .55); border-radius: 2px; cursor: grab; touch-action: none; }
.fbox.sel { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.fbox .h-w, .fbox .h-s { position: absolute; touch-action: none; background: var(--paper); border: 2px solid var(--accent); }
.fbox .h-w { right: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; cursor: ew-resize; }
.fbox .h-s { right: -9px; bottom: -9px; width: 16px; height: 16px; border-radius: 3px; cursor: nwse-resize; background: var(--accent); }
.quick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.quick b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 4.2em; text-align: center; }
.quick .flabel:not(:first-child) { margin-left: 10px; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.addrow select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); }
.props { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
input[type="color"] { height: 38px; padding: 2px 4px; }
.count { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.count .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 15px; }
.count .n b { font-size: 20px; font-weight: 500; }
.stepper { display: flex; gap: 6px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; }
.stepper button:hover { border-color: var(--accent); color: var(--accent); }
.pill { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.pill.low { background: var(--apricot-soft); color: var(--warn); }
.pill.out { background: var(--line); color: var(--muted); }
.pill.ex { background: var(--accent-soft); color: var(--accent); }
.label .actions { display: flex; gap: 4px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 8px; }

/* Carnet de recettes */
.year { display: grid; gap: 14px; }
.year-head { display: flex; align-items: baseline; gap: 14px; }
.year-head h2 { font-size: 34px; color: var(--accent); font-variant-numeric: tabular-nums; }
.year-head span { color: var(--muted); font-size: 14px; }
.year-head::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); transform: translateY(-6px); }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.recipe { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.recipe h3 { font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
.recipe .fruit { color: var(--muted); font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; border-block: 1px solid var(--line); padding-block: 10px; }
.fact { display: grid; }
.fact b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 16px; }
.fact span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stars { color: var(--apricot); letter-spacing: 2px; font-size: 15px; }
.versions { font-size: 13px; color: var(--muted); }
.versions button { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
details summary { cursor: pointer; font-weight: 500; color: var(--accent); }
details .body { display: grid; gap: 10px; padding-top: 10px; }
details h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
details ul, details ol { margin: 0; padding-left: 20px; }
details p { margin: 0; }
.recipe .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.recipe.flash { outline: 2px solid var(--apricot); }

.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: var(--r); padding: 32px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 22px; }
.notice { background: var(--apricot-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; }

/* Dialogue */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--paper); color: var(--ink); width: min(620px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); }
dialog::backdrop { background: rgba(20, 8, 15, .45); }
dialog form { display: grid; gap: 14px; padding: 22px; }
dialog h2 { font-size: 26px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); width: 100%; min-width: 0; }
.field textarea { min-height: 88px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.form-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.form-actions .right { display: flex; gap: 8px; margin-left: auto; }
.err { color: var(--danger); font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; }

@media (max-width: 520px) {
  .fields { grid-template-columns: 1fr; }
  .search { width: 100%; }
  .tools { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .label, .recipe { transition: border-color .15s; }
  .label:hover, .recipe:hover { border-color: var(--accent); }
}

/* Version iPhone */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
input, select, textarea { font-size: 16px; } /* évite le zoom automatique de Safari */
.local-sheet { position: fixed; inset: 0; z-index: 1000; background: rgba(20, 8, 15, .45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.local-card { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: grid; gap: 12px; }
.local-card h2 { font-size: 22px; }
.local-card p { margin: 0; color: var(--muted); }
.local-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <div class="kicker">Confitures maison</div>
      <h1>Cellier à confitures</h1>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><b id="sPots">–</b><span>pots en réserve</span></div>
      <div class="stat"><b id="sParfums">–</b><span>parfums</span></div>
      <div class="stat"><b id="sRecettes">–</b><span>recettes</span></div>
      <div class="stat"><b id="sAnnees">–</b><span>millésimes</span></div>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-cellier" aria-selected="true" data-view="cellier">Cellier</button>
      <button class="tab" role="tab" id="tab-carnet" aria-selected="false" data-view="carnet">Carnet de recettes</button>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Chercher un fruit, un parfum…" aria-label="Rechercher">
      <button class="btn" id="exportBtn" hidden>Exporter en Excel</button>
      <button class="btn primary" id="addBtn">+ Nouveau lot</button>
    </div>
  </div>

  <div class="chips" id="years" aria-label="Filtrer par année"></div>

  <main id="view"></main>
</div>

<dialog id="dlg"><form id="frm" novalidate></form></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="local-shim.js"></script>
<script>
(() => {
  const THIS_YEAR = new Date().getFullYear();
  const state = { view: "cellier", year: "all", taille: "all", q: "", recettes: [], lots: [], ready: { r: false, l: false } };
  const TAILLES = [
    { v: "petit", t: "Petit", pl: "Petits", g: 250 },
    { v: "standard", t: "Standard", pl: "Standards", g: 370 },
    { v: "grand", t: "Grand", pl: "Grands", g: 720 },
  ];
  // Taille d'un lot : le champ enregistré, sinon déduite de la contenance.
  function tailleOf(l) {
    if (TAILLES.some(t => t.v === l.taille)) return l.taille;
    const c = num(l.contenance);
    if (!c) return "standard";
    return c <= 280 ? "petit" : (c <= 500 ? "standard" : "grand");
  }
  const tailleLabel = (v) => (TAILLES.find(t => t.v === v) || TAILLES[1]).t;
  // Pots d'un lot par taille : { petit: {n: remplis, r: restants}, standard: {...}, grand: {...} }.
  // Les anciens lots (une seule taille) sont convertis à la volée.
  function potsOf(l) {
    const out = {}; TAILLES.forEach(t => { out[t.v] = { n: 0, r: 0 }; });
    if (l.pots && typeof l.pots === "object") {
      TAILLES.forEach(t => { const p = l.pots[t.v] || {}; const r = Math.max(0, num(p.r)); out[t.v] = { n: Math.max(r, num(p.n)), r }; });
    } else {
      const r = Math.max(0, num(l.restants)); out[tailleOf(l)] = { n: Math.max(r, num(l.nbPots)), r };
    }
    return out;
  }
  const lotTitle = (l) => (l.numero ? `${l.numero} - ` : "") + (l.nom || "Sans nom");
  function nextNumero() { return state.lots.reduce((m, l) => Math.max(m, num(l.numero)), 0) + 1; }
  let db = null, canWrite = true;

  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  try { const v = localStorage.getItem("cellier.view"); if (v === "carnet" || v === "cellier") state.view = v; } catch (e) {}
  if (location.hash === "#carnet") state.view = "carnet";
  if (location.hash === "#cellier") state.view = "cellier";

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
  }
  function notice(msg) { const n = $("#notice"); n.textContent = msg; n.hidden = !msg; }

  // ---------- Rendu ----------
  function ratio(r) { const f = num(r.fruitsG), s = num(r.sucreG); return f > 0 && s > 0 ? Math.round(s / f * 100) : null; }
  function stars(n) { n = Math.max(0, Math.min(5, num(n))); return n ? "★".repeat(n) + "☆".repeat(5 - n) : ""; }
  function matches(obj, fields) {
    if (!state.q) return true;
    const q = norm(state.q);
    return fields.some(f => norm(obj[f]).includes(q));
  }

  function renderStats() {
    const pots = state.lots.reduce((a, l) => a + Math.max(0, num(l.restants)), 0);
    const parfums = new Set(state.lots.filter(l => num(l.restants) > 0).map(l => norm(l.nom))).size;
    const annees = new Set([...state.recettes.map(r => r.annee), ...state.lots.map(l => l.annee)].filter(Boolean));
    $("#sPots").textContent = pots;
    $("#sParfums").textContent = parfums;
    $("#sRecettes").textContent = state.recettes.length;
    $("#sAnnees").textContent = annees.size;
  }

  function renderYears() {
    const src = state.view === "cellier" ? state.lots : state.recettes;
    const years = [...new Set(src.map(x => num(x.annee)).filter(Boolean))].sort((a, b) => b - a);
    if (state.year !== "all" && !years.includes(num(state.year))) state.year = "all";
    const el = $("#years");
    if (years.length < 2) { el.innerHTML = ""; return; }
    el.innerHTML = [`<button class="chip" data-year="all" aria-pressed="${state.year === "all"}">Toutes</button>`]
      .concat(years.map(y => `<button class="chip" data-year="${y}" aria-pressed="${String(state.year) === String(y)}">${y}</button>`)).join("");
  }

  function lotCard(l) {
    const P = potsOf(l);
    const n = TAILLES.reduce((a, t) => a + P[t.v].r, 0), total = TAILLES.reduce((a, t) => a + P[t.v].n, 0);
    const used = TAILLES.filter(t => P[t.v].n > 0);
    const rows = (used.length ? used : [TAILLES[1]]).map(t => {
      const p = P[t.v], shown = Math.min(p.n, 12);
      const jars = Array.from({ length: shown }, (_, i) => `<span class="jar ${t.v}${i < p.r ? " full" : ""}"></span>`).join("") + (p.n > shown ? `<span class="hint">+${p.n - shown}</span>` : "");
      return `<div class="srow"><span class="size-tag">${t.t}</span><span class="jars" aria-hidden="true">${jars}</span>
        <span class="n"><b>${p.r}</b>/${p.n}</span>
        <span class="stepper"><button type="button" data-act="minus" data-size="${t.v}" aria-label="Retirer un pot ${t.t.toLowerCase()}" ${p.r === 0 || !canWrite ? "disabled" : ""}>−</button><button type="button" data-act="plus" data-size="${t.v}" aria-label="Ajouter un pot ${t.t.toLowerCase()}" ${!canWrite ? "disabled" : ""}>+</button></span></div>`;
    }).join("");
    const pill = n === 0 ? `<span class="pill out">Épuisé</span>` : (n <= 2 ? `<span class="pill low">Bientôt fini</span>` : "");
    const rec = l.recetteId && state.recettes.find(r => r.id === l.recetteId);
    const meta = [
      l.date ? `<span>Mise en pot : ${esc(fmtDate(l.date))}</span>` : "",
      l.provenance ? `<span>Fruits de ${esc(l.provenance)}</span>` : "",
      l.emplacement ? `<span>${esc(l.emplacement)}</span>` : ""
    ].filter(Boolean).join("");
    return `<article class="label${n === 0 ? " empty-lot" : ""}" data-lot="${esc(l.id)}">
      <div class="top"><h3>${esc(lotTitle(l))}</h3><span class="vintage">${esc(l.annee || "—")}</span></div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
      <div class="sizerows">${rows}</div>
      <div class="count">
        <span class="n">Total : <b>${n}</b> / ${total} pots ${pill} ${l.exemple ? `<span class="pill ex">Exemple</span>` : ""}</span>
      </div>
      ${l.notes ? `<div class="meta">${esc(l.notes)}</div>` : ""}
      <div class="actions">
        ${rec ? `<button class="btn ghost small" data-act="see-recipe" data-id="${esc(rec.id)}">Voir la recette</button>` : ""}
        <button class="btn ghost small" data-act="labels">Étiquettes</button>
        <button class="btn ghost small" data-act="edit-lot" ${!canWrite ? "disabled" : ""}>Modifier</button>
      </div>
    </article>`;
  }

  const MOIS = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
  function fmtDate(d) {
    // Mois et année en majuscules : « OCTOBRE 2026 » (dates enregistrées en AAAA-MM ou AAAA-MM-JJ).
    const m = /^(\d{4})-(\d{2})/.exec(d || ""); if (!m || +m[2] < 1 || +m[2] > 12) return d || "";
    return `${MOIS[+m[2] - 1]} ${m[1]}`;
  }

  function renderCellier() {
    const base = state.lots.filter(l => (state.year === "all" || String(l.annee) === String(state.year)) && matches(l, ["numero", "nom", "emplacement", "provenance", "notes"]));
    let lots = base.filter(l => state.taille === "all" || potsOf(l)[state.taille].n > 0);
    lots.sort((a, b) => (num(b.restants) > 0) - (num(a.restants) > 0) || num(b.annee) - num(a.annee) || String(a.nom).localeCompare(b.nom, "fr"));
    if (!state.ready.l) return `<div class="empty"><h3>Ouverture du cellier…</h3><p>Vos lots de pots vont apparaître ici.</p></div>`;
    if (!state.lots.length) return `<div class="empty"><h3>Le cellier est vide</h3><p>Ajoutez votre premier lot : le parfum, l'année et le nombre de pots remplis.</p><button class="btn primary" data-act="new-lot">+ Nouveau lot</button></div>`;
    const parTaille = TAILLES.map(t => ({ ...t, n: base.reduce((a, l) => a + potsOf(l)[t.v].r, 0) }));
    const sizes = `<div class="sizes" aria-label="Pots restants par taille">
      <span>En réserve :</span>
      ${parTaille.map(t => `<span><b>${t.n}</b> ${t.n > 1 ? t.pl.toLowerCase() : t.t.toLowerCase()}</span>`).join("")}
      <span class="chips" style="margin-left:auto">
        <button class="chip" data-taille="all" aria-pressed="${state.taille === "all"}">Toutes tailles</button>
        ${TAILLES.map(t => `<button class="chip" data-taille="${t.v}" aria-pressed="${state.taille === t.v}">${t.pl}</button>`).join("")}
      </span>
    </div>`;
    if (!lots.length) return sizes + `<div class="empty"><p>Aucun lot ne correspond à cette recherche.</p></div>`;
    return sizes + `<div class="grid">${lots.map(lotCard).join("")}</div>`;
  }

  function recipeCard(r) {
    const rt = ratio(r);
    const others = state.recettes.filter(o => o.id !== r.id && norm(o.nom) === norm(r.nom)).sort((a, b) => num(b.annee) - num(a.annee));
    const lines = (t) => String(t || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
    const ing = lines(r.ingredients);
    const potsFaits = state.lots.filter(l => l.recetteId === r.id).reduce((a, l) => a + num(l.nbPots), 0);
    return `<article class="recipe" id="r-${esc(r.id)}" data-recipe="${esc(r.id)}">
      <div class="top" style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <div><h3>${esc(r.nom || "Sans nom")}</h3>${r.fruits ? `<div class="fruit">${esc(r.fruits)}</div>` : ""}</div>
        <span class="vintage">${esc(r.annee || "—")}</span>
      </div>
      <div class="facts">
        <div class="fact"><b>${rt != null ? rt + " %" : "—"}</b><span>Sucre / fruit</span></div>
        <div class="fact"><b>${r.cuisson ? esc(r.cuisson) + " min" : "—"}</b><span>Cuisson</span></div>
        <div class="fact"><b>${r.rendement ? esc(r.rendement) : "—"}</b><span>Pots prévus</span></div>
      </div>
      ${r.note || r.exemple ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${r.note ? `<span class="stars" aria-label="${num(r.note)} sur 5">${stars(r.note)}</span>` : ""}${r.exemple ? `<span class="pill ex">Exemple</span>` : ""}</div>` : ""}
      ${others.length ? `<div class="versions">Aussi faite en ${others.map(o => `<button data-act="goto" data-id="${esc(o.id)}">${esc(o.annee)}</button>`).join(", ")}</div>` : ""}
      ${potsFaits ? `<div class="versions">${potsFaits} pots mis en cave avec cette recette</div>` : ""}
      ${(ing.length || r.notes) ? `<details><summary>Ingrédients et notes</summary><div class="body">
        ${ing.length ? `<h4>Ingrédients</h4><ul>${ing.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
        ${r.notes ? `<h4>Notes de l'année</h4><p>${esc(r.notes)}</p>` : ""}
      </div></details>` : ""}
      <div class="actions">
        <button class="btn small" data-act="edit-recipe" ${!canWrite ? "disabled" : ""}>Modifier</button>
        ${num(r.annee) !== THIS_YEAR ? `<button class="btn small" data-act="redo" ${!canWrite ? "disabled" : ""}>Refaire en ${THIS_YEAR}</button>` : ""}
        <button class="btn small" data-act="lot-from" ${!canWrite ? "disabled" : ""}>Mettre en pots</button>
      </div>
    </article>`;
  }

  function renderCarnet() {
    if (!state.ready.r) return `<div class="empty"><h3>Ouverture du carnet…</h3><p>Vos recettes, rangées par année, vont apparaître ici.</p></div>`;
    if (!state.recettes.length) return `<div class="empty"><h3>Le carnet est vide</h3><p>Notez votre première recette avec son année : vous pourrez la reprendre et l'ajuster les saisons suivantes.</p><button class="btn primary" data-act="new-recipe">+ Nouvelle recette</button></div>`;
    const list = state.recettes.filter(r => (state.year === "all" || String(r.annee) === String(state.year)) && matches(r, ["nom", "fruits", "ingredients", "notes"]));
    if (!list.length) return `<div class="empty"><p>Aucune recette ne correspond à cette recherche.</p></div>`;
    const byYear = new Map();
    list.forEach(r => { const y = num(r.annee) || 0; if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(r); });
    return [...byYear.keys()].sort((a, b) => b - a).map(y => {
      const rs = byYear.get(y).sort((a, b) => String(a.nom).localeCompare(b.nom, "fr"));
      return `<section class="year"><div class="year-head"><h2>${y || "Sans année"}</h2><span>${rs.length} recette${rs.length > 1 ? "s" : ""}</span></div>
        <div class="recipes">${rs.map(recipeCard).join("")}</div></section>`;
    }).join("");
  }

  function render() {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === state.view)));
    $("#addBtn").textContent = state.view === "cellier" ? "+ Nouveau lot" : "+ Nouvelle recette";
    $("#addBtn").disabled = !canWrite;
    renderStats(); renderYears();
    $("#view").innerHTML = state.view === "cellier" ? renderCellier() : `<div style="display:grid;gap:32px">${renderCarnet()}</div>`;
  }

  // ---------- Formulaires ----------
  const dlg = $("#dlg"), frm = $("#frm");
  let onSave = null;

  function field(id, label, value, opts = {}) {
    const v = esc(value ?? "");
    const cls = opts.wide ? "field wide" : "field";
    let input;
    if (opts.type === "textarea") input = `<textarea id="${id}" name="${id}" placeholder="${esc(opts.ph || "")}">${v}</textarea>`;
    else if (opts.type === "select") input = `<select id="${id}" name="${id}">${opts.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(value ?? "") ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</select>`;
    else input = `<input id="${id}" name="${id}" type="${opts.type || "text"}" value="${v}" ${opts.min != null ? `min="${opts.min}"` : ""} ${opts.max != null ? `max="${opts.max}"` : ""} ${opts.step ? `step="${opts.step}"` : ""} placeholder="${esc(opts.ph || "")}" ${opts.required ? "required" : ""}>`;
    return `<div class="${cls}"><label for="${id}">${label}</label>${input}${opts.hint ? `<span class="hint">${opts.hint}</span>` : ""}</div>`;
  }

  function openForm(title, fieldsHtml, save, del, submitLabel = "Enregistrer") {
    frm.oninput = null; frm.onchange = null;
    dlg.classList.remove("big");
    frm.innerHTML = `<h2>${esc(title)}</h2><div class="fields">${fieldsHtml}</div><div class="err" id="ferr" hidden></div>
      <div class="form-actions">${del ? `<button type="button" class="btn danger" id="fdel">Supprimer</button>` : ""}
      <div class="right"><button type="button" class="btn" id="fcancel">Annuler</button><button type="submit" class="btn primary" id="fsave">${esc(submitLabel)}</button></div></div>`;
    onSave = save;
    $("#fcancel", frm).onclick = () => dlg.close();
    if (del) {
      const b = $("#fdel", frm);
      b.onclick = async () => {
        if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer la suppression"; return; }
        b.disabled = true;
        try { await del(); dlg.close(); toast("Supprimé"); } catch (e) { showErr(e); b.disabled = false; }
      };
    }
    if (!dlg.open) { if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", ""); }
    const first = frm.querySelector("input,select,textarea"); first && first.focus();
  }
  function showErr(e) {
    const el = $("#ferr", frm); if (!el) return;
    const code = e && e.code;
    el.textContent = code === "quota_exceeded" ? "Le cellier est plein : supprimez d'anciens lots ou recettes avant d'en ajouter."
      : code === "invalid_argument" ? "Vous n'avez pas le droit de modifier ce cellier."
      : (e && e.message) || "L'enregistrement a échoué. Réessayez dans un instant.";
    el.hidden = false;
  }
  frm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(frm).entries());
    const btn = $("#fsave", frm); btn.disabled = true;
    try { const msg = await onSave(data); dlg.close(); toast(msg || "Enregistré"); }
    catch (e) { showErr(e); btn.disabled = false; }
  });

  function recipeOptions() {
    return [{ v: "", t: "— Aucune —" }].concat([...state.recettes].sort((a, b) => num(b.annee) - num(a.annee) || String(a.nom).localeCompare(b.nom, "fr")).map(r => ({ v: r.id, t: `${r.nom} (${r.annee})` })));
  }

  function lotForm(l = {}, preset = {}) {
    const d = { annee: THIS_YEAR, date: new Date().toISOString().slice(0, 7), ...preset, ...l };
    const isEdit = !!l.id;
    const P0 = isEdit ? potsOf(l) : { petit: { n: 0, r: 0 }, standard: { n: num(preset.nbPots) || 6, r: 0 }, grand: { n: 0, r: 0 } };
    const potGrid = `<div class="field wide"><span class="flabel">Nombre de pots</span>
      <div class="potgrid${isEdit ? " edit" : ""}">
        <span></span><span class="flabel">Remplis</span>${isEdit ? `<span class="flabel">Restants</span>` : ""}
        ${TAILLES.map(t => `<label for="f_n_${t.v}">${t.t}</label>
          <input id="f_n_${t.v}" name="f_n_${t.v}" type="number" min="0" value="${P0[t.v].n}">
          ${isEdit ? `<input id="f_r_${t.v}" name="f_r_${t.v}" type="number" min="0" value="${P0[t.v].r}" aria-label="${t.t} : pots restants">` : ""}`).join("")}
      </div><span class="hint" id="f_tot"></span></div>`;
    if (!isEdit && !d.numero) d.numero = nextNumero();
    openForm(isEdit ? "Modifier le lot" : "Nouveau lot de pots", [
      field("f_num", "N° de lot", d.numero, { type: "number", min: 1, hint: isEdit ? "" : "Proposé automatiquement." }),
      field("f_nom", "Parfum", d.nom, { required: true, ph: "Abricot-lavande" }),
      field("f_annee", "Année", d.annee, { type: "number", min: 1950, max: 2100 }),
      (() => {
        const dm = /^(\d{4})-(\d{2})/.exec(d.date || "");
        const mo = dm ? dm[2] : "", an = dm ? dm[1] : "";
        return `<div class="field"><label for="f_mois">Mise en pot</label><div class="pair">
          <select id="f_mois" name="f_mois" aria-label="Mois de mise en pot"><option value="">—</option>${MOIS.map((n, i) => { const v = String(i + 1).padStart(2, "0"); return `<option value="${v}" ${v === mo ? "selected" : ""}>${n}</option>`; }).join("")}</select>
          <input id="f_dan" name="f_dan" type="number" min="1950" max="2100" value="${esc(an)}" aria-label="Année de mise en pot"></div></div>`;
      })(),
      potGrid,
      field("f_empl", "Rangement", d.emplacement, { ph: "Cave, étagère du haut" }),
      field("f_prov", "Provenance des fruits", d.provenance, { ph: "PARIS" }),
      field("f_rec", "Recette", d.recetteId, { type: "select", options: recipeOptions(), wide: true }),
      field("f_notes", "Notes", d.notes, { type: "textarea", wide: true, ph: "Un peu liquide, à offrir à Noël…" }),
    ].join(""), async (f) => {
      if (!f.f_nom.trim()) throw { message: "Indiquez le parfum." };
      const numero = Math.round(num(f.f_num)) || null;
      const pris = numero && state.lots.find(o => o.id !== l.id && num(o.numero) === numero);
      if (pris) throw { message: `Le n° ${numero} est déjà pris par « ${pris.nom} ». Choisissez-en un autre.` };
      const body = {
        numero, nom: f.f_nom.trim(), annee: num(f.f_annee) || THIS_YEAR, date: f.f_mois && num(f.f_dan) ? `${Math.round(num(f.f_dan))}-${f.f_mois}` : "",
        provenance: (f.f_prov || "").trim().toUpperCase(),
        emplacement: f.f_empl.trim(), recetteId: f.f_rec || "", notes: f.f_notes.trim(),
        exemple: false, modifie: new Date().toISOString()
      };
      body.pots = {};
      TAILLES.forEach(t => {
        let n = Math.max(0, Math.round(num(f["f_n_" + t.v])));
        const r = isEdit ? Math.max(0, Math.round(num(f["f_r_" + t.v]))) : n;
        if (r > n) n = r;
        body.pots[t.v] = { n, r };
      });
      body.nbPots = TAILLES.reduce((a, t) => a + body.pots[t.v].n, 0);
      body.restants = TAILLES.reduce((a, t) => a + body.pots[t.v].r, 0);
      if (isEdit) await db.collection("lots").doc(l.id).set(body);
      else await db.collection("lots").add(body);
      return isEdit ? "Lot mis à jour" : "Lot ajouté au cellier";
    }, isEdit ? () => db.collection("lots").doc(l.id).delete() : null);
    const tot = () => {
      const n = TAILLES.reduce((a, t) => a + Math.max(0, num((gf("f_n_" + t.v) || {}).value)), 0);
      const r = isEdit ? TAILLES.reduce((a, t) => a + Math.max(0, num((gf("f_r_" + t.v) || {}).value)), 0) : n;
      gf("f_tot").textContent = isEdit ? `Total : ${r} restants sur ${n} pots remplis.` : `Total : ${n} pot${n > 1 ? "s" : ""}.`;
    };
    frm.oninput = tot; tot();
  }

  function recipeForm(r = {}, opts = {}) {
    const isEdit = !!r.id && !opts.copy;
    const d = { annee: THIS_YEAR, ...r };
    if (opts.copy) { d.annee = THIS_YEAR; d.note = ""; d.notes = ""; }
    openForm(isEdit ? "Modifier la recette" : (opts.copy ? `Refaire en ${THIS_YEAR}` : "Nouvelle recette"), [
      field("r_nom", "Nom", d.nom, { required: true, ph: "Fraise-rhubarbe" }),
      field("r_annee", "Année", d.annee, { type: "number", min: 1950, max: 2100 }),
      field("r_fruits", "Fruits et provenance", d.fruits, { wide: true, ph: "Abricots du Valais, bien mûrs" }),
      field("r_fg", "Fruits préparés (g)", d.fruitsG, { type: "number", min: 0, step: 10, hint: "Poids après dénoyautage." }),
      field("r_sg", "Sucre (g)", d.sucreG, { type: "number", min: 0, step: 10, hint: "Le taux sucre / fruit se calcule seul." }),
      field("r_cuis", "Durée de cuisson (min)", d.cuisson, { type: "number", min: 0 }),
      field("r_rend", "Pots prévus", d.rendement, { type: "number", min: 0 }),
      field("r_ing", "Ingrédients (un par ligne)", d.ingredients, { type: "textarea", wide: true }),
      field("r_notes", "Notes de l'année", d.notes, { type: "textarea", wide: true, ph: "Moins de sucre que l'an dernier, prise parfaite." }),
      field("r_note", "Appréciation", d.note || "", { type: "select", options: [{ v: "", t: "—" }, 1, 2, 3, 4, 5].map(o => typeof o === "object" ? o : { v: o, t: "★".repeat(o) }) }),
    ].join(""), async (f) => {
      if (!f.r_nom.trim()) throw { message: "Indiquez le nom de la recette." };
      const body = {
        nom: f.r_nom.trim(), annee: num(f.r_annee) || THIS_YEAR, fruits: f.r_fruits.trim(),
        fruitsG: num(f.r_fg) || null, sucreG: num(f.r_sg) || null, cuisson: num(f.r_cuis) || null, rendement: num(f.r_rend) || null,
        ingredients: f.r_ing.trim(), etapes: (isEdit && r.etapes) || "", notes: f.r_notes.trim(), note: num(f.r_note) || null,
        exemple: false, modifie: new Date().toISOString()
      };
      if (isEdit) await db.collection("recettes").doc(r.id).set(body);
      else { const ref = await db.collection("recettes").add(body); state.year = "all"; flashId = ref.id; }
      return isEdit ? "Recette mise à jour" : `Recette ${body.annee} ajoutée au carnet`;
    }, isEdit ? () => db.collection("recettes").doc(r.id).delete() : null);
  }

  let flashId = null;

  // ---------- Événements ----------
  document.addEventListener("click", async (ev) => {
    const tab = ev.target.closest(".tab");
    if (tab) { state.view = tab.dataset.view; state.year = "all"; try { localStorage.setItem("cellier.view", state.view); } catch (e) {} render(); return; }
    const chip = ev.target.closest(".chip");
    if (chip && chip.dataset.taille) { state.taille = chip.dataset.taille; render(); return; }
    if (chip && chip.dataset.year) { state.year = chip.dataset.year; render(); return; }
    if (ev.target.closest("#addBtn")) { if (!db) return; state.view === "cellier" ? lotForm() : recipeForm(); return; }

    const b = ev.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    const lotEl = b.closest("[data-lot]"), recEl = b.closest("[data-recipe]");
    const lot = lotEl && state.lots.find(l => l.id === lotEl.dataset.lot);
    const rec = recEl && state.recettes.find(r => r.id === recEl.dataset.recipe);

    if (act === "new-lot" && db) return lotForm();
    if (act === "new-recipe" && db) return recipeForm();
    if (act === "edit-lot" && lot) return lotForm(lot);

    function read() {
      const c = (id) => g(id).checked;
      return { tplId: g("e_tpl").value, format: g("e_format").value, police: m.police, couleur: g("e_couleur").value,
        cadre: c("e_cadre"), coupe: c("e_coupe"), annee: c("e_annee"), date: c("e_date"), cont: false, taille: c("e_taille"),
        fruits: c("e_fruits"), prov: c("e_prov"), sucre: c("e_sucre"), ing: c("e_ing"), notes: c("e_notes"),
        mention: g("e_mention").value, dx: num(g("e_dx").value), dy: num(g("e_dy").value) };
    }
    function syncTpl() {
      const tpl = curTpl();
      g("e_auto").hidden = !!tpl;
      g("e_edit").hidden = !tpl || !canWrite;
      g("e_import").hidden = !assets || !canWrite;
      if (tpl) { g("e_format").value = tpl.format || g("e_format").value; g("e_format").disabled = true; }
      else g("e_format").disabled = false;
    }
    function preview() {
      if (!g("e_prev")) return;
      const mm = read(), f = fmt(mm), per = f.cols * f.rows, tpl = curTpl();
      const cv = g("e_prev");
      const avail = Math.max(160, (cv.parentElement.clientWidth || 340) - 24);
      const cssW = Math.min(avail, f.round ? 230 : 360), k = cssW / f.w, cssH = f.h * k, dpr = window.devicePixelRatio || 1;
      cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
      cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
      cv.classList.toggle("round", !!f.round);
      const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cssW, cssH);
      let note = "";
      if (tpl) {
        const entry = tpl.assetId ? getImg(tpl.assetId) : null;
        if (entry && !entry.ready && !entry.error) entry.wait.add(preview);
        if (entry && entry.error) note = " L'image du modèle n'a pas pu être chargée.";
        drawCustomLabel(canvasPainter(ctx, k), 0, 0, f, lotFor(), rec, tpl, entry);
      } else drawLabel(canvasPainter(ctx, k), 0, 0, f, lotFor(), rec, mm);
      const st = g("e_start"); st.max = per;
      const nb = Math.max(1, Math.round(num(g("e_nb").value)) || 1), s0 = Math.min(per, Math.max(1, Math.round(num(st.value)) || 1));
      const pages = Math.ceil((s0 - 1 + nb) / per);
      g("e_info").textContent = `${nb} étiquette${nb > 1 ? "s" : ""} sur ${pages} page${pages > 1 ? "s" : ""} A4 (${per} par planche). Imprimez le PDF en taille réelle, à 100 %.${note}${FONT_NOTE}`;
    }
    frm.oninput = (ev) => {
      if (ev.target.id === "e_tpl") syncTpl();
      if (ev.target.id === "e_pot") g("e_nb").value = lotPots[ev.target.value].n || 1;
      preview();
    };
    frm.onchange = null;
    g("e_import").onclick = () => tplEditor(null, lot);
    g("e_edit").onclick = () => { const tpl = curTpl(); if (tpl) tplEditor(tpl, lot); };
    syncTpl();
    preview();
    loadLabelFonts().then(preview);
  }

  let qt; $("#q").addEventListener("input", (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120); });

  // ---------- Données ----------
  render();
  (async () => {
    if (!window.claude || typeof window.claude.use !== "function") {
      notice("L'enregistrement n'est pas disponible dans cet affichage. Ce navigateur ne permet pas d'enregistrer les données. Ouvrez l'application dans Safari.");
      canWrite = false; state.ready = { r: true, l: true }; render(); return;
    }
    db = await window.claude.use("db");
    if (!db) {
      notice("Ce navigateur ne permet pas d'enregistrer les données (navigation privée ?). Ouvrez l'application depuis son icône sur l'écran d'accueil.");
      canWrite = false; state.ready = { r: true, l: true }; render(); return;
    }
    try {
      const user = await window.claude.use("user");
      if (user && typeof user.can === "function") { const w = await user.can("data.write"); if (w === false) { canWrite = false; notice("Vous consultez ce cellier en lecture seule."); } }
    } catch (e) {}
    const onErr = (e) => { if (e && e.code !== "revoked") notice("Le cellier ne se met plus à jour. Rechargez la page."); };
    db.collection("recettes").onSnapshot((snap) => {
      state.recettes = snap.docs.map(d => ({ id: d.id, ...d.data() })); state.ready.r = true; render();
      if (flashId) { const id = flashId; flashId = null; if (state.view === "carnet") goToRecipe(id); }
    }, onErr);
    try { assets = await window.claude.use("assets"); } catch (e) { assets = null; }
    db.collection("modeles").onSnapshot((snap) => { state.modeles = snap.docs.map(d => ({ id: d.id, ...d.data() })); }, () => {});
    db.doc("reglages/etiquettes").onSnapshot((s) => { state.modele = s.exists ? { ...MODELE_DEF, ...s.data() } : { ...MODELE_DEF }; }, () => {});
    db.collection("lots").onSnapshot((snap) => {
      state.lots = snap.docs.map(d => ({ id: d.id, ...d.data() })); state.ready.l = true; render();
    }, onErr);
  })();
})();
</script>
</body>
</html>
